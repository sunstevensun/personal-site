<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roster</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Azeret+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#08090B;
  --s1:#121317; --s2:#1A1C21; --s3:#23262C; --s4:#2E323A;
  --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.045);
  --silver:#DFE2E8; --steel:#949AA5; --ash:#5C626D;
  --jade:#5CD49B; --jade-lo:#12301F; --jade-dim:rgba(92,212,155,.10);
  --sky:#63A9F2; --sky-lo:#12253A;
  --tang:#E8944A; --tang-lo:#3A2611;
  --rust:#F0614F; --rust-lo:#3A1611; --rust-dim:rgba(240,97,79,.10);
  --disp:'DM Serif Display',Georgia,serif;
  --body:'DM Sans',system-ui,sans-serif;
  --mono:'Azeret Mono',ui-monospace,monospace;
  --edge:#000; --onSilver:#0A0B0D; --onJade:#08130D; --onRust:#160705;
  --safe: env(safe-area-inset-bottom, 0px);
}
[data-theme="light"]{
  --bg:#E2D8A5;
  --s1:#EBE3B9; --s2:#F1EBC9; --s3:#D2C793; --s4:#BFB37A;
  --line:rgba(48,40,16,.16); --line2:rgba(48,40,16,.08);
  --silver:#2A2415; --steel:#5C5334; --ash:#655C3A;
  --jade:#2E6B46; --jade-lo:#A9C2A2; --jade-dim:rgba(46,107,70,.13);
  --rust:#A63A21; --rust-lo:#D3B098; --rust-dim:rgba(166,58,33,.11);
  --sky:#2B5A8C; --sky-lo:#AFC1D6;
  --tang:#8F5313; --tang-lo:#D5BA85;
  --edge:#CFC38E; --onSilver:#EFE9CB; --onJade:#EFE9CB; --onRust:#F3EED6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--edge);color:var(--silver);font-family:var(--body);
  display:flex;justify-content:center;overscroll-behavior:none}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:1px solid var(--jade);outline-offset:2px;border-radius:5px}

#app{width:100%;max-width:420px;background:var(--bg);display:flex;flex-direction:column;
  height:100dvh;position:relative;overflow:hidden;color:var(--silver)}

/* demo bar — not product */
#demo{background:var(--edge);border-bottom:1px solid var(--line);padding:6px 8px;
  display:flex;gap:4px;align-items:center;flex:none;flex-wrap:wrap}
#demo .lbl{font-family:var(--mono);font-size:7px;letter-spacing:.14em;color:var(--ash);
  text-transform:uppercase;margin-right:1px}
#demo button{font-family:var(--mono);font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 7px;border-radius:4px;border:1px solid var(--line);color:var(--ash);white-space:nowrap}
#demo button.on{background:var(--s3);color:var(--silver)}
#demo .sp{flex:1}

.top{padding:15px 18px 12px;border-bottom:1px solid var(--line2);flex:none;
  display:flex;align-items:baseline;justify-content:space-between}
.mark{font-family:var(--disp);font-size:19px;letter-spacing:-.005em;color:var(--silver)}
.mark span{color:var(--ash);transition:color .4s}
.mark span.on{color:var(--jade)}
.top .ctx{font-family:var(--mono);font-size:8px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ash)}

.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;
  padding:18px 16px calc(22px + var(--safe));-webkit-overflow-scrolling:touch}

.nav{flex:none;background:var(--bg);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:grid;padding-bottom:var(--safe)}
.nav button{padding:11px 0 13px;font-family:var(--mono);font-size:8px;
  letter-spacing:.15em;text-transform:uppercase;color:var(--ash);
  border-top:1px solid transparent;transition:color .18s}
.nav button.on{color:var(--silver);border-top-color:var(--silver)}
.nav button.lk{opacity:.3}

/* type */
.eyebrow{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ash);margin:0 0 10px}
h1{font-family:var(--disp);font-weight:400;font-size:27px;margin:0 0 5px;
  letter-spacing:-.012em;line-height:1.16;color:var(--silver)}
h2{font-family:var(--disp);font-weight:400;font-size:17px;margin:0 0 8px;letter-spacing:-.008em}
h3{font-family:var(--disp);font-weight:400;font-size:25px;margin:9px 0 6px;
  letter-spacing:-.012em;line-height:1.14}
.num{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.note{font-size:11px;color:var(--ash);line-height:1.62;margin-top:11px}
.note b{color:var(--steel);font-weight:500}

.card{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:11px}
.card.q{background:none;border-color:var(--line2)}

.btn{display:block;width:100%;padding:13px;border-radius:9px;background:var(--silver);
  color:var(--onSilver);font-family:var(--body);font-weight:500;font-size:14px;letter-spacing:.01em}
.btn.g{background:none;border:1px solid var(--line);color:var(--silver)}
.btn.sm{padding:11px;font-size:12.5px}
.btn+.btn{margin-top:8px}

.av{border-radius:9px;display:grid;place-items:center;flex:none;
  font-family:var(--mono);font-weight:700;width:32px;height:32px;font-size:10px;
  box-sizing:border-box}
.av.st-good{background:rgba(92,212,155,.17);border:1.5px solid var(--jade);color:var(--jade)}
.av.st-rec{background:rgba(99,169,242,.16);border:1.5px solid var(--sky);color:var(--sky)}
.av.st-dec{background:rgba(232,148,74,.16);border:1.5px solid var(--tang);color:var(--tang)}
.av.st-bad{background:rgba(240,97,79,.15);border:1.5px solid var(--rust);color:var(--rust)}
.av.st-none{color:var(--onSilver)}
.stkey{display:flex;flex-wrap:wrap;gap:11px;margin-top:11px}
.stkey span{font-family:var(--mono);font-size:7.5px;color:var(--ash);letter-spacing:.09em;
  text-transform:uppercase;display:flex;align-items:center;gap:5px}
.stkey b{width:11px;height:11px;border-radius:3px;display:block;box-sizing:border-box}

/* history strip */
.strip{display:flex;align-items:flex-end;gap:2px;height:19px}
.strip i{width:3.5px;border-radius:.5px;display:block;flex:none;height:100%}
.strip i.K{background:var(--jade)}
.strip i.F{background:var(--rust)}
.strip i.L{background:var(--rust);opacity:.5}
.strip i.C{background:var(--jade);opacity:.38}
.strip i.N{background:var(--steel);opacity:.55}
.strip i.G{background:none;border:1px dashed var(--ash);border-radius:0;opacity:.7}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.legend span{font-family:var(--mono);font-size:7.5px;color:var(--ash);
  display:flex;align-items:center;gap:5px;letter-spacing:.08em;text-transform:uppercase}
.legend b{width:5px;height:11px;border-radius:.5px;display:block}

/* ── deck ── */
.deck{position:relative;margin-top:12px;perspective:1500px}
.stack{position:absolute;left:0;right:0;top:0;
  transition:transform .34s cubic-bezier(.22,.9,.28,1),opacity .3s}
.stack.behind{pointer-events:none}
[data-theme='light'] .stack.behind .face{background:var(--s1);border-color:var(--line)}
.stack.behind .face{background:#0E0F12;border-color:rgba(255,255,255,.10);
  box-shadow:0 -8px 20px rgba(48,40,16,.18)}
.swipe{position:relative;background:none;border:0;padding:0;border-radius:14px;
  touch-action:pan-y;will-change:transform;cursor:pointer}
.flipper{position:relative;width:100%;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.22,.9,.28,1)}
.flipper.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:16px;border:1px solid var(--line);padding:18px;
  background:var(--s2);color:var(--silver);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 -12px 30px rgba(48,40,16,.22)}
.face.front{position:relative}
.face.back{transform:rotateY(180deg);padding:15px 15px 11px}
.face.back .scrollr{flex:1;overflow-y:auto;overscroll-behavior:contain;margin:0 -4px;padding:0 4px}
.face.back .scrollr::-webkit-scrollbar{width:0}
.whenrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.when{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--steel)}
.who{font-size:12px;color:var(--steel)}
.spacer{flex:1}
.hintrow{display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-family:var(--mono);font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:var(--ash)}
.hintrow .flipcue{opacity:.65}
.flipcue{font-family:var(--mono);font-size:7.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ash)}

.stamp{position:absolute;top:20px;font-family:var(--disp);font-size:20px;
  padding:5px 13px;border-radius:6px;opacity:0;pointer-events:none;z-index:5;letter-spacing:-.01em}
.stamp.go{right:18px;border:1px solid var(--jade);color:var(--jade);transform:rotate(8deg)}
.stamp.no{left:18px;border:1px solid var(--rust);color:var(--rust);transform:rotate(-8deg)}

/* live pill — sits with the time */
.livepill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--jade);
  border:1px solid var(--jade-lo);background:var(--jade-dim);border-radius:20px;padding:4px 9px}
.livepill i{width:5px;height:5px;border-radius:50%;background:var(--jade);display:block;
  animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.cibar{display:flex;align-items:center;gap:9px;margin-top:11px;padding:10px 12px;
  border-radius:10px;border:1px solid var(--jade-lo);background:var(--jade-dim)}
.cibar .tx{flex:1;font-size:12px;color:var(--silver)}
.cibar .tx small{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ash);margin-top:3px}
.cibar button{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:8px 13px;border-radius:7px;background:var(--jade);color:var(--onJade);font-weight:700;flex:none}
.cibar .tick2{width:21px;height:21px;border-radius:50%;background:var(--jade);color:var(--onJade);
  display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}

/* attendee rows */
.rank{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}
.rank .ix{font-family:var(--mono);font-size:8.5px;color:var(--ash);width:13px;flex:none}
.rank .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .sc{font-family:var(--mono);font-weight:700;font-size:12.5px;flex:none;
  font-variant-numeric:tabular-nums}
.hi{color:var(--jade)} .mid{color:var(--silver)} .lo{color:var(--rust)} .na{color:var(--ash)}
.there{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--jade);border:1px solid var(--jade-lo);background:var(--jade-dim);
  border-radius:20px;padding:3px 8px;flex:none}
.p1{font-family:var(--mono);font-size:7.5px;letter-spacing:.1em;color:var(--steel);
  border:1px solid var(--line);border-radius:20px;padding:2px 6px;flex:none}
.seclab{font-family:var(--mono);font-size:8px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ash);margin:16px 0 4px;display:flex;align-items:baseline;gap:7px}
.seclab .ct2{color:var(--steel)}
.newnote{font-size:10.5px;color:var(--ash);line-height:1.5;margin:0 0 6px}
.mini2{margin-top:9px}
.mini2 .r{display:flex;align-items:center;gap:8px;padding:3.5px 0}
.mini2 .r .av{width:20px;height:20px;border-radius:6px;font-size:7.5px}
.mini2 .r .n2{flex:1;font-size:11.5px;color:var(--steel);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.mini2 .r .s2{font-family:var(--mono);font-weight:700;font-size:10.5px;font-variant-numeric:tabular-nums}
.mini2 .rest{font-family:var(--mono);font-size:8px;color:var(--ash);letter-spacing:.1em;
  padding-top:6px;text-transform:uppercase}

/* +1 */
.p1box{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;
  border:1px solid var(--line);border-radius:10px}
.p1box .lb2{flex:1;font-size:12px}
.p1box .lb2 small{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ash);margin-top:4px}
.p1box button{width:29px;height:29px;border-radius:7px;border:1px solid var(--line);
  font-family:var(--mono);font-size:13px;display:grid;place-items:center;color:var(--silver)}
.p1box .ct{font-family:var(--mono);font-weight:700;font-size:15px;min-width:18px;text-align:center}
.p1box.on{border-color:var(--jade-lo);background:var(--jade-dim)}

/* calendars */
.vswitch{display:flex;gap:5px;margin-bottom:4px}
.vswitch button{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
  padding:7px 12px;border-radius:20px;border:1px solid var(--line);color:var(--steel)}
.vswitch button.on{background:var(--silver);border-color:var(--silver);color:var(--onSilver);font-weight:700}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.mnav .mo{font-family:var(--disp);font-size:18px;letter-spacing:-.01em}
.mnav button{font-family:var(--mono);font-size:14px;color:var(--steel);padding:5px 13px;
  border:1px solid var(--line);border-radius:7px;line-height:1}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mgrid .h{font-family:var(--mono);font-size:7.5px;color:var(--ash);text-align:center;padding-bottom:4px}
.mcell{aspect-ratio:1;border-radius:7px;background:var(--s1);border:1px solid var(--line2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.mcell.out{background:none;border-color:transparent;opacity:.28}
.mcell.today{border-color:var(--silver);background:rgba(255,255,255,.05)}
.mcell .d{font-family:var(--mono);font-size:9.5px;color:var(--steel)}
.mcell.today .d{color:var(--silver);font-weight:700}
.mcell .dots{display:flex;gap:2px;height:4px}
.mcell .dots i{width:4px;height:4px;border-radius:50%;display:block}
.wk{font-family:var(--mono);font-size:8px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ash);margin:14px 0 6px}

.inv{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line2);
  width:100%;text-align:left}
.inv .body{flex:1;min-width:0}
.inv .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv .m{font-family:var(--mono);font-size:8px;color:var(--ash);margin-top:4px;letter-spacing:.09em}
.inv .m.warn{color:var(--rust)}
.pill{font-family:var(--mono);font-size:7.5px;letter-spacing:.13em;text-transform:uppercase;
  padding:4px 8px;border-radius:20px;border:1px solid var(--line);color:var(--steel);flex:none}
.pill.go{background:var(--jade);border-color:var(--jade);color:var(--onJade);font-weight:700}
.pill.no{border-color:var(--rust-lo);color:var(--rust)}
.pill.by{border-color:var(--line);background:var(--s3);color:var(--silver)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(20,16,6,.55);z-index:60;
  display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:420px;background:var(--s1);color:var(--silver);border-radius:16px 16px 0 0;
  border-top:1px solid var(--line);padding:16px 16px calc(26px + var(--safe));
  max-height:88vh;overflow-y:auto;animation:up .24s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{transform:translateY(101%)}}
.grab{width:30px;height:3px;border-radius:2px;background:var(--s4);margin:0 auto 15px}
.rsvp{display:grid;gap:7px;margin-top:14px}
.rsvp button{padding:13px 15px;border-radius:10px;border:1px solid var(--line);
  font-size:13px;text-align:left}
.rsvp button.sel{background:var(--jade);border-color:var(--jade);color:var(--onJade);font-weight:700}
.rsvp button.sel.n{background:var(--rust);border-color:var(--rust);color:var(--onRust)}
.rsvp button.sel.b{background:var(--silver);border-color:var(--silver);color:var(--onSilver)}
.rsvp small{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.12em;
  text-transform:uppercase;opacity:.62;margin-top:4px}
.dates{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.dates button{font-family:var(--mono);font-size:9px;padding:7px 10px;border-radius:7px;
  border:1px solid var(--line);color:var(--steel)}
.dates button.on{background:var(--silver);border-color:var(--silver);color:var(--onSilver);font-weight:700}

/* check-in */
.cirow{display:flex;gap:8px;margin-top:14px;align-items:stretch}
.entry{flex:1;background:var(--s1);border:1px solid var(--line);border-radius:10px;
  padding:14px 13px;color:var(--silver);font-family:var(--mono);font-size:15px;
  letter-spacing:.05em;text-transform:uppercase}
.entry::placeholder{color:var(--ash);letter-spacing:.14em;font-size:11px}
.go2{flex:none;padding:0 19px;border-radius:10px;background:var(--jade);color:var(--onJade);
  font-family:var(--body);font-weight:500;font-size:13.5px;display:grid;place-items:center}
.done{text-align:center;padding:38px 16px}
.done .ring{width:62px;height:62px;border-radius:50%;background:var(--jade);color:var(--onJade);
  display:grid;place-items:center;font-size:27px;margin:0 auto 16px;
  animation:pop .42s cubic-bezier(.22,1.4,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}

/* projection */
.proj.sticky{position:sticky;top:-1px;z-index:15;
  box-shadow:0 10px 18px -6px var(--bg);backdrop-filter:blur(6px)}
.proj{background:linear-gradient(168deg,var(--s2),var(--s1) 62%);
  border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:11px}
.big{font-family:var(--mono);font-weight:700;font-size:40px;line-height:.9;
  color:var(--silver);letter-spacing:-.045em}
.band{margin-top:15px;height:23px;position:relative}
.band .tr{position:absolute;top:10px;left:0;right:0;height:2px;background:var(--s4);border-radius:2px}
.band .fl{position:absolute;top:10px;height:2px;background:var(--silver);border-radius:2px;
  transition:left .3s,width .3s}
.band .tk{position:absolute;top:5px;width:1px;height:12px;background:var(--silver);transition:left .3s}
.band .lb{position:absolute;top:19px;font-family:var(--mono);font-size:7.5px;color:var(--ash)}
.ceil{border-top:1px solid var(--line);margin-top:13px;padding-top:11px;
  display:flex;align-items:baseline;justify-content:space-between}
.ceil .n{font-family:var(--mono);font-weight:700;font-size:18px;color:var(--steel)}
.ceil .k{font-family:var(--mono);font-size:7.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ash)}
.warnbox{border:1px solid var(--rust-lo);background:var(--rust-dim);border-radius:9px;
  padding:11px 12px;margin-top:10px;font-size:11.5px;line-height:1.55;color:var(--steel)}
.warnbox b{color:var(--rust);font-weight:500}

/* people rows */
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--line2);width:100%;text-align:left}
.prow .nm{flex:1;min-width:0}
.prow .nm .a{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm .b{font-family:var(--mono);font-size:8px;color:var(--ash);margin-top:3px;letter-spacing:.09em}
.snap{display:flex;gap:9px;flex:none}
.snap div{text-align:right}
.snap .v{font-family:var(--mono);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.snap .k{font-family:var(--mono);font-size:6.5px;letter-spacing:.11em;color:var(--ash);
  text-transform:uppercase;margin-top:2px}
.add{font-family:var(--mono);font-size:8px;letter-spacing:.13em;text-transform:uppercase;
  padding:7px 10px;border-radius:7px;border:1px solid var(--line);color:var(--steel);flex:none}
.add.on{background:var(--silver);border-color:var(--silver);color:var(--onSilver);font-weight:700}

/* record */
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0 0}
.three div{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:11px 9px}
.three .v{font-family:var(--mono);font-weight:700;font-size:18px;line-height:1}
.three .k{font-family:var(--mono);font-size:7px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ash);margin-top:6px;line-height:1.35}
.lockbox{background:var(--s1);border:1px solid var(--line);border-radius:10px;
  padding:13px;font-size:11.5px;color:var(--steel);line-height:1.6}
.lockbox b{color:var(--silver);font-weight:500}

/* door */
.codebox{background:var(--s1);border:1px solid var(--line);border-radius:14px;
  padding:24px 18px;text-align:center;margin-top:8px}
.code{font-family:var(--mono);font-weight:700;font-size:25px;letter-spacing:.02em;
  color:var(--jade);line-height:1.3}
.tick{height:2px;background:var(--s3);border-radius:2px;margin-top:16px;overflow:hidden}
.tick i{display:block;height:100%;background:var(--jade);width:100%;transform-origin:left}
.drow{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;
  border:1px solid var(--line2);margin-bottom:6px;background:var(--s1);transition:all .25s}
.drow.in{border-color:var(--jade-lo);background:var(--jade-dim)}
.drow.part{border-color:var(--line);background:var(--s2)}
.drow .st{font-family:var(--mono);font-size:7.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ash)}
.dact{display:flex;gap:5px;flex:none;align-items:center}
.dact button{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 9px;border-radius:7px;border:1px solid var(--line);color:var(--steel)}
.dact button.p1b{color:var(--silver)}
.dact .ok{width:24px;height:24px;border-radius:50%;background:var(--jade);color:var(--onJade);
  display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.dact .okp{background:var(--s4);color:var(--silver)}
.chk{width:18px;height:18px;border-radius:50%;background:var(--jade);color:var(--onJade);
  display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.tapin{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 10px;border-radius:7px;border:1px solid var(--line);color:var(--steel)}

.bigcode{position:fixed;inset:0;z-index:90;background:var(--bg);color:var(--silver);display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.bigcode .w{font-family:var(--mono);font-weight:700;color:var(--jade);line-height:1.05;
  font-size:clamp(38px,13vw,96px);letter-spacing:-.02em;word-break:break-word}
.bigcode .cd{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ash);margin-top:28px}
.bigcode .ev{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ash);position:absolute;top:26px}
.bigcode .x{position:absolute;bottom:34px;font-family:var(--mono);font-size:9px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--steel);
  border:1px solid var(--line);border-radius:7px;padding:11px 18px}
.bigcode .bar{position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--s3)}
.bigcode .bar i{display:block;height:100%;background:var(--jade);transform-origin:left}

/* rating */
.rate{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.rate button{padding:16px 10px;border-radius:10px;border:1px solid var(--line);
  font-family:var(--body);font-size:13px}
.rate button.sel{background:var(--jade);border-color:var(--jade);color:var(--onJade);font-weight:500}
.rate button.sel.n{background:var(--s3);border-color:var(--steel);color:var(--silver)}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:12px;color:var(--silver);font-family:var(--body);font-size:13px;min-height:74px;
  resize:vertical;margin-top:10px}
textarea::placeholder{color:var(--ash)}

/* create */
.lab{font-family:var(--mono);font-size:8px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ash);margin:18px 0 7px;display:block}
input[type=time],input[type=number],select,.in,.field{
  width:100%;background:var(--s1);border:1px solid var(--line);border-radius:10px;
  padding:13px;color:var(--silver);font-family:var(--body);font-size:15px;
  -webkit-appearance:none;appearance:none}
input[type=time]{font-family:var(--mono);letter-spacing:.02em}
input[type=number]{font-family:var(--mono);font-weight:700;font-size:19px;text-align:center}
select{background-image:linear-gradient(45deg,transparent 50%,var(--steel) 50%),
  linear-gradient(135deg,var(--steel) 50%,transparent 50%);
  background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}
select option{background:var(--s2);color:var(--silver)}
input::-webkit-calendar-picker-indicator{filter:invert(.65)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cal{margin-top:6px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.calhead .mo{font-family:var(--disp);font-size:17px;letter-spacing:-.01em}
.calhead button{font-family:var(--mono);font-size:13px;color:var(--steel);padding:5px 12px;
  border:1px solid var(--line);border-radius:7px;line-height:1}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cg .h{font-family:var(--mono);font-size:7.5px;color:var(--ash);text-align:center;padding-bottom:4px}
.cg button{aspect-ratio:1;border-radius:7px;font-family:var(--mono);font-size:11px;
  color:var(--steel);background:var(--s1);border:1px solid var(--line2);
  display:grid;place-items:center}
.cg button.pastd{opacity:.25}
.cg button.sel{background:var(--silver);border-color:var(--silver);color:var(--onSilver);font-weight:700}
.cg span{aspect-ratio:1}
.pol{display:grid;gap:6px;margin-top:4px}
.pol button{padding:12px 13px;border-radius:10px;border:1px solid var(--line);text-align:left;font-size:12.5px}
.pol button.on{background:var(--s2);border-color:var(--silver)}
.pol .ttl{display:block}
.pol small{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ash);margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:7.5px;
  letter-spacing:.14em;text-transform:uppercase;padding:5px 9px;border-radius:20px;
  border:1px solid var(--line);color:var(--steel)}
.badge.open{color:var(--silver)}
.badge.none{opacity:.6}
.fab{position:absolute;right:16px;bottom:calc(72px + var(--safe));z-index:20;
  background:var(--silver);color:var(--onSilver);border-radius:24px;padding:13px 19px;
  font-family:var(--body);font-weight:500;font-size:13.5px;
  box-shadow:0 8px 26px rgba(48,40,16,.28), 0 0 0 4px var(--bg)}
.gate{border:1px solid var(--rust-lo);background:var(--rust-dim);border-radius:11px;
  padding:14px;margin-bottom:12px}
.gate h4{font-family:var(--disp);font-size:16px;margin:0 0 7px;color:var(--rust);letter-spacing:-.008em}
.gate p{margin:0;font-size:11.5px;line-height:1.6;color:var(--steel)}
.evrow{display:flex;align-items:center;gap:11px;padding:12px 0;
  border-bottom:1px solid var(--line2);width:100%;text-align:left}
.evrow .bd{flex:1;min-width:0}
.evrow .t{font-size:13.5px}
.evrow .m{font-family:var(--mono);font-size:8px;color:var(--ash);margin-top:4px;letter-spacing:.09em}
.evrow .m.due{color:var(--rust)}
.rev{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.rev .k{color:var(--ash)}
.rev .v{font-family:var(--mono);font-size:11px}

/* pause */
.sw{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}
.sw:last-of-type{border-bottom:0}
.sw .cp{flex:1}
.sw .cp b{display:block;font-weight:500;font-size:12.5px}
.sw .cp small{display:block;font-size:10.5px;color:var(--ash);line-height:1.55;margin-top:4px}
.tog{width:42px;height:25px;border-radius:13px;background:var(--s3);position:relative;
  flex:none;transition:background .2s;border:1px solid var(--line)}
.tog i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
  background:var(--ash);transition:transform .2s,background .2s}
.tog.on{background:var(--jade-dim);border-color:var(--jade-lo)}
.tog.on i{transform:translateX(17px);background:var(--jade)}

/* disclosure */
.disc{padding:30px 22px calc(28px + var(--safe));min-height:100%;display:flex;flex-direction:column}
.disc h1{font-size:42px;margin-bottom:26px;line-height:1.06}
.dblock{border-left:1px solid var(--line);padding-left:17px;margin-bottom:28px}
.dblock.key{border-color:var(--jade);background:var(--jade-dim);
  padding:13px 15px;border-radius:0 8px 8px 0}
.dblock h4{font-family:var(--disp);font-size:23px;margin:0 0 10px;letter-spacing:-.012em;
  line-height:1.14}
.dblock p{margin:0;font-size:16px;line-height:1.6;color:var(--steel)}
.dblock .sc{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.dblock .sc span{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  border:1px solid var(--jade-lo);color:var(--jade);padding:5px 10px;border-radius:20px}
.steps{display:none}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.opts button{font-family:var(--mono);font-size:9.5px;padding:9px 12px;border-radius:8px;
  border:1px solid var(--line);color:var(--steel)}
.opts button.on{background:var(--silver);border-color:var(--silver);color:var(--onSilver);font-weight:700}
/* ── invitations ── */
.slot{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line2)}
.slot .ic{width:30px;height:30px;border-radius:8px;border:1px dashed var(--ash);flex:none;
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--ash)}
.slot .ic.used{border:1px solid var(--line);background:var(--s2);color:var(--steel)}
.slot .ic.claimed{border:0;background:var(--jade);color:var(--onJade);font-weight:700}
.slot .bd{flex:1;min-width:0}
.slot .bd .t{font-size:12.5px}
.slot .bd .m{font-family:var(--mono);font-size:8px;color:var(--ash);margin-top:4px;letter-spacing:.1em}
.slot .bd .m.live{color:var(--jade)}
.slot .act{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;
  padding:7px 10px;border-radius:7px;border:1px solid var(--line);color:var(--steel);flex:none}
.slot .act.pri{background:var(--silver);border-color:var(--silver);color:var(--onSilver);font-weight:700}

.linkbox{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:13px;
  margin-top:12px;display:flex;align-items:center;gap:10px}
.linkbox code{flex:1;font-family:var(--mono);font-size:11px;color:var(--jade);
  word-break:break-all;line-height:1.5}
.linkbox button{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;
  padding:8px 11px;border-radius:7px;background:var(--silver);color:var(--onSilver);font-weight:700;flex:none}
.meta{display:flex;gap:14px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line2)}
.meta div .v{font-family:var(--mono);font-weight:700;font-size:13px}
.meta div .k{font-family:var(--mono);font-size:7px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ash);margin-top:4px}

/* claim page */
.claim{padding:30px 22px calc(30px + var(--safe));min-height:100%;display:flex;flex-direction:column}
.crest{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--disp);font-size:20px;color:var(--jade);
  margin-bottom:22px}
.fromwho{display:flex;align-items:center;gap:11px;padding:13px;border:1px solid var(--line);
  border-radius:10px;background:var(--s1);margin:18px 0}
.fromwho .bd{flex:1}
.fromwho .bd .t{font-size:13px}
.fromwho .bd .m{font-family:var(--mono);font-size:8px;color:var(--ash);margin-top:4px;letter-spacing:.1em}

/* referral queue */
.qrow{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line2)}
.qrow .n{font-family:var(--mono);font-size:9px;color:var(--ash);width:14px;flex:none}
.qrow .bd{flex:1;min-width:0}
.qrow .bd .t{font-size:12.5px}
.qrow .bd .m{font-family:var(--mono);font-size:8px;color:var(--ash);margin-top:4px;letter-spacing:.1em}
.qrow .act{display:flex;gap:5px;flex:none}
.qrow .act button{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;
  padding:7px 9px;border-radius:7px;border:1px solid var(--line);color:var(--steel)}
.qrow .act button.pri{background:var(--jade);border-color:var(--jade);color:var(--onJade);font-weight:700}
.emptyq{border:1px dashed var(--line);border-radius:10px;padding:20px 16px;text-align:center;
  color:var(--ash);font-size:11.5px;line-height:1.6;margin-top:10px}

/* vouch request */
.vouch{border:1px solid var(--jade-lo);background:var(--jade-dim);border-radius:11px;
  padding:14px;margin-bottom:11px}
.vouch h4{font-family:var(--disp);font-size:16px;margin:0 0 7px;letter-spacing:-.008em}
.vouch p{margin:0;font-size:11.5px;line-height:1.6;color:var(--steel)}
.vouch .row{display:flex;gap:7px;margin-top:12px}
.vouch .row button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
.vouch .row button.yes{background:var(--jade);border-color:var(--jade);color:var(--onJade);font-weight:700}

.wl{padding:26px 20px calc(26px + var(--safe));min-height:100%;display:flex;flex-direction:column}
.pos{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--jade);border:1px solid var(--jade-lo);background:var(--jade-dim);
  border-radius:20px;padding:7px 13px;display:inline-flex;align-self:flex-start}

/* ── sponsorship ── */
.spon{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line2)}
.spon .bd{flex:1;min-width:0}
.spon .bd .t{font-size:12.5px}
.spon .bd .m{font-family:var(--mono);font-size:8px;color:var(--ash);margin-top:4px;letter-spacing:.1em}
.spon .bd .m.good{color:var(--jade)}
.spon .bd .m.bad{color:var(--rust)}
.prog{display:flex;gap:3px;margin-top:7px}
.prog i{width:20px;height:3px;border-radius:2px;background:var(--s3);display:block}
.prog i.k{background:var(--jade)}
.prog i.f{background:var(--rust)}
.earn{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;
  padding:5px 9px;border-radius:20px;flex:none;border:1px solid var(--line);color:var(--ash)}
.earn.yes{border-color:var(--jade-lo);background:var(--jade-dim);color:var(--jade)}
.earn.no{border-color:var(--rust-lo);background:var(--rust-dim);color:var(--rust)}
.avail{display:flex;align-items:baseline;gap:11px;margin-top:14px}
.avail .n{font-family:var(--mono);font-weight:700;font-size:42px;color:var(--silver);
  line-height:.9;letter-spacing:-.04em}
.avail .k{font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash)}

/* ── invitation ledger ── */
.ledg{margin-top:6px}
.ledg .r{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.ledg .r:last-child{border-bottom:0}
.ledg .r .lb3{flex:1;font-size:12.5px}
.ledg .r .lb3 small{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ash);margin-top:4px}
.ledg .r .amt{font-family:var(--mono);font-weight:700;font-size:14px;flex:none;
  font-variant-numeric:tabular-nums}
.ledg .r .amt.plus{color:var(--jade)}
.ledg .r .amt.minus{color:var(--steel)}
.ledg .tot{display:flex;align-items:baseline;gap:10px;padding-top:12px;margin-top:4px;
  border-top:1px solid var(--line)}
.ledg .tot .lb3{flex:1;font-size:12.5px;color:var(--silver)}
.ledg .tot .amt{font-family:var(--mono);font-weight:700;font-size:19px;color:var(--silver)}

.tiers{display:grid;gap:4px;margin-top:10px}
.tiers .t2{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
  border:1px solid var(--line2);font-family:var(--mono);font-size:9.5px;color:var(--ash)}
.tiers .t2.you{border-color:var(--jade-lo);background:var(--jade-dim);color:var(--jade)}
.tiers .t2 .rg{flex:1}
.tiers .t2 .gv{font-weight:700}
.locked{border:1px dashed var(--line);border-radius:10px;padding:18px 16px;text-align:center;
  color:var(--ash);font-size:11.5px;line-height:1.65;margin-top:14px}
.locked b{color:var(--steel);font-weight:500}

/* ── cycle allowance ── */
.cyc{background:linear-gradient(168deg,var(--s2),var(--s1) 62%);border:1px solid var(--line);
  border-radius:14px;padding:16px;margin-top:14px}
.cyc .hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.cyc .hd .k{font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash)}
.cyc .big2{font-family:var(--mono);font-weight:700;font-size:38px;color:var(--silver);
  line-height:.9;letter-spacing:-.04em}
.cyc .sub2{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ash);margin-top:7px}
.pips{display:flex;gap:5px;margin-top:14px}
.pips i{flex:1;height:5px;border-radius:3px;background:var(--s3);display:block;max-width:34px}
.pips i.left{background:var(--silver)}
.pips i.gone{background:var(--s4)}
.nxt{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;
  display:flex;align-items:baseline;justify-content:space-between}
.nxt .k{font-family:var(--mono);font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:var(--ash)}
.nxt .v{font-family:var(--mono);font-weight:700;font-size:16px}
.nxt .v.up{color:var(--jade)} .nxt .v.dn{color:var(--rust)}
.contrib{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line2)}
.contrib .bd{flex:1;min-width:0}
.contrib .bd .t{font-size:12.5px}
.contrib .bd .m{font-family:var(--mono);font-size:8px;color:var(--ash);margin-top:4px;letter-spacing:.1em}
.contrib .d{font-family:var(--mono);font-weight:700;font-size:13px;flex:none}
.contrib .d.plus{color:var(--jade)} .contrib .d.minus{color:var(--rust)} .contrib .d.zero{color:var(--ash)}

.gone{font-family:var(--mono);font-size:8px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--rust);border:1px solid var(--rust-lo);background:var(--rust-dim);
  border-radius:20px;padding:3px 8px;flex:none}

/* ── host notes on the card ── */
.deets{font-size:11.5px;line-height:1.55;color:var(--steel);margin-top:10px;
  padding-left:11px;border-left:1px solid var(--line);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.deets.full{-webkit-line-clamp:unset;display:block}
textarea.deets-in{min-height:88px}


/* ── answer-first invitation rows ── */
.inv.needs{background:var(--s1);border:1px solid var(--line);border-radius:10px;
  padding:12px;margin-bottom:7px;border-bottom:1px solid var(--line)}
.pill.answer{background:var(--silver);border-color:var(--silver);color:var(--onSilver);
  font-weight:700;padding:7px 13px;font-size:8.5px}
.divid{font-family:var(--mono);font-size:8px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ash);margin:20px 0 8px}

/* ── host: past event summary ── */
.sumrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.sumrow:last-child{border-bottom:0}
.sumrow .k2{font-family:var(--mono);font-size:8px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ash);flex:none;width:104px}
.sumrow .v2{flex:1;font-size:12.5px}
.sumrow .v2 small{display:block;font-family:var(--mono);font-size:8px;color:var(--ash);
  margin-top:3px;letter-spacing:.1em}
.turnout{display:flex;align-items:baseline;gap:9px;margin:2px 0 10px}
.turnout .n3{font-family:var(--mono);font-weight:700;font-size:30px;letter-spacing:-.03em}
.turnout .n3.good{color:var(--jade)} .turnout .n3.off{color:var(--rust)}
.turnout .k3{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}

/* ── +1 confirm state ── */
.dact button.p1b.on{background:var(--jade);border-color:var(--jade);color:var(--onJade);font-weight:700}
.dact button.p1b.off{background:var(--s3);border-color:var(--line);color:var(--ash)}

/* ── deadlines on Today ── */
.dl-strip{margin-bottom:14px}
.dl-row{display:flex;align-items:center;gap:11px;padding:12px;border-radius:10px;
  border:1px solid var(--line);background:var(--s1);margin-bottom:7px;width:100%;text-align:left}
.dl-row.urgent{border-color:var(--rust-lo);background:var(--rust-dim)}
.dl-row.lapsed{border-color:var(--line2);background:none;opacity:.75}
.dl-row .bd{flex:1;min-width:0}
.dl-row .bd .t{font-size:13px}
.dl-row .bd .m{font-family:var(--mono);font-size:8px;color:var(--ash);margin-top:4px;letter-spacing:.11em}
.dl-row.urgent .bd .m{color:var(--rust)}
.dl-row .cta{font-family:var(--mono);font-size:8px;letter-spacing:.13em;text-transform:uppercase;
  padding:7px 11px;border-radius:7px;background:var(--silver);color:var(--onSilver);font-weight:700;flex:none}
.dl-row.lapsed .cta{background:none;border:1px solid var(--line);color:var(--ash);font-weight:400}
.rtline{display:flex;align-items:center;gap:9px;margin-top:10px;padding:10px 12px;
  border-radius:9px;border:1px solid var(--line2)}
.rtline .v4{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--silver)}
.rtline .k4{flex:1;font-size:11px;color:var(--ash);line-height:1.5}

/* ── answer cards ── */
.face.ask{background:var(--rust-dim);
  border-color:rgba(240,97,79,.34)}
[data-theme='light'] .stack.behind .face.ask{background:#E8D3C2;border-color:var(--rust-lo)}
.stack.behind .face.ask{background:#170D0B;border-color:rgba(240,97,79,.22)}
.duepill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--rust);
  border:1px solid var(--rust-lo);background:var(--rust-dim);border-radius:20px;padding:4px 9px}
.duepill i{width:5px;height:5px;border-radius:50%;background:var(--rust);display:block}
.waited{display:flex;align-items:baseline;gap:9px;margin-top:12px;padding:10px 12px;
  border-radius:9px;border:1px solid var(--line)}
.waited .v5{font-family:var(--mono);font-weight:700;font-size:17px;color:var(--silver)}
.waited .k5{flex:1;font-size:10.5px;color:var(--ash);line-height:1.5}
.waited.slow .v5{color:var(--rust)}
.stamp.yes2{right:18px;border:1px solid var(--jade);color:var(--jade);transform:rotate(8deg)}
.stamp.no2{left:18px;border:1px solid var(--rust);color:var(--rust);transform:rotate(-8deg)}

/* ── lapsed list ── */
.lapsehead{font-family:var(--mono);font-size:8px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ash);margin:22px 0 8px}
.lapse{display:flex;align-items:center;gap:11px;padding:12px;border-radius:10px;
  border:1px solid var(--line2);margin-bottom:7px}
.lapse .bd{flex:1;min-width:0}
.lapse .bd .t{font-size:12.5px;color:var(--steel)}
.lapse .bd .m{font-family:var(--mono);font-size:8px;color:var(--ash);margin-top:4px;letter-spacing:.11em}
.lapse .wl2{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;
  padding:8px 11px;border-radius:7px;border:1px solid var(--line);color:var(--silver);flex:none}
.lapse .wl2.on{background:var(--silver);border-color:var(--silver);color:var(--onSilver);font-weight:700}
.lapse .wl2.full{opacity:.4}

/* ── gate + orientation ── */
.gate2{position:fixed;inset:0;z-index:200;background:var(--bg);color:var(--silver);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:32px 24px calc(32px + var(--safe));text-align:center}
.gate2 .mk{font-family:var(--disp);font-size:34px;color:var(--silver);letter-spacing:-.01em}
.gate2 .mk span{color:var(--jade)}
.gate2 .sub3{font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ash);margin-top:12px}
.gate2 input{width:100%;max-width:290px;margin-top:34px;background:var(--s1);
  border:1px solid var(--line);border-radius:10px;padding:15px;color:var(--silver);
  font-family:var(--mono);font-size:16px;text-align:center;letter-spacing:.08em;
  text-transform:lowercase;-webkit-appearance:none}
.gate2 input::placeholder{color:var(--ash);letter-spacing:.16em;font-size:11px;text-transform:uppercase}
.gate2 input.wrong{border-color:var(--rust);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gate2 button{width:100%;max-width:290px;margin-top:10px;padding:14px;border-radius:10px;
  background:var(--silver);color:var(--onSilver);font-family:var(--body);font-weight:500;font-size:14px}
.gate2 .hint2{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ash);margin-top:24px;line-height:1.9}

.orient{padding:34px 22px calc(30px + var(--safe));min-height:100%;display:flex;flex-direction:column}
.orient h1{font-size:29px;margin-bottom:6px}
.ostep{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--line2)}
.ostep .no2{font-family:var(--mono);font-size:9px;color:var(--ash);width:15px;flex:none;padding-top:2px}
.ostep .bd2{flex:1}
.ostep .bd2 b{display:block;font-weight:500;font-size:13px}
.ostep .bd2 small{display:block;font-size:11px;color:var(--ash);line-height:1.55;margin-top:4px}
.otip{border:1px solid var(--line);border-radius:10px;padding:13px;margin-top:18px;
  font-size:11.5px;line-height:1.6;color:var(--steel)}
.otip b{color:var(--silver);font-weight:500}

.peek{padding:15px 18px 0}
.peek .pw2{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ash)}
.peek .pt{font-family:var(--disp);font-size:19px;color:var(--steel);letter-spacing:-.012em;
  margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── conflict flag ── */
.clash{display:flex;align-items:center;gap:9px;margin-top:11px;padding:10px 12px;
  border-radius:9px;border:1px solid rgba(240,97,79,.30);background:var(--rust-dim)}
.clash .ic2{font-family:var(--mono);font-size:13px;color:var(--rust);flex:none}
.clash .tx2{flex:1;font-size:11.5px;color:var(--silver);line-height:1.5}
.clash .tx2 small{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--rust);margin-top:4px}

/* ── member record sheet ── */
.rec-hd{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.rec-hd .bd3{flex:1}
.rec-hd .bd3 .n6{font-family:var(--disp);font-size:21px;letter-spacing:-.01em}
.rec-hd .bd3 .h6{font-family:var(--mono);font-size:8.5px;color:var(--ash);
  letter-spacing:.12em;margin-top:4px}
.rec-hd .big3{font-family:var(--mono);font-weight:700;font-size:28px;letter-spacing:-.03em}
.reads{border:1px solid var(--line);border-radius:10px;padding:13px;margin-top:14px;
  font-size:12px;line-height:1.6;color:var(--steel)}
.reads b{color:var(--silver);font-weight:500}

/* ── settle-first FAB ── */
.fab.settle{background:var(--rust);color:var(--onRust)}
/* ── suggestions from history ── */
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg button{font-family:var(--mono);font-size:9.5px;padding:8px 11px;border-radius:8px;
  border:1px dashed rgba(255,255,255,.16);color:var(--steel);display:flex;align-items:center;gap:6px}
.sugg button:active{border-style:solid}
.sugg button.on{background:var(--silver);border-color:var(--silver);border-style:solid;
  color:var(--onSilver);font-weight:700}
.sugg .why{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash)}
.sugg button.on .why{color:rgba(10,11,13,.55)}
.recall{font-family:var(--mono);font-size:8px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ash);margin-top:9px;display:block}
.usual{border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin-top:10px;
  font-size:11.5px;line-height:1.6;color:var(--steel)}
.usual b{color:var(--silver);font-weight:500}
.usual .row2{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.usual .row2 button{font-family:var(--mono);font-size:9px;padding:7px 10px;border-radius:7px;
  border:1px solid var(--line);color:var(--silver)}

/* ── progress toward a record ── */
.prog2{border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:14px}
.prog2.done{border-color:var(--jade-lo);background:var(--jade-dim)}
.prog2 .hd2{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.prog2 .hd2 .t3{font-family:var(--disp);font-size:18px;letter-spacing:-.01em}
.prog2 .hd2 .c3{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--steel)}
.prog2.done .hd2 .c3{color:var(--jade)}
.pips2{display:flex;gap:4px}
.pips2 i{flex:1;height:6px;border-radius:3px;background:var(--s3);display:block}
.pips2 i.fill{background:var(--silver)}
.prog2.done .pips2 i.fill{background:var(--jade)}
.rhythm{display:flex;align-items:center;gap:9px;margin-top:13px;padding-top:12px;
  border-top:1px solid var(--line2)}
.rhythm .dot3{width:7px;height:7px;border-radius:50%;flex:none}
.rhythm .tx3{flex:1;font-size:11.5px;color:var(--ash);line-height:1.5}
.rhythm .tx3 b{color:var(--silver);font-weight:500}

/* opening-week emptiness */
.cold{border:1px dashed var(--line);border-radius:12px;padding:20px 16px;text-align:center;
  color:var(--ash);font-size:12px;line-height:1.65;margin-top:12px}
.cold b{color:var(--steel);font-weight:500}

/* ── global page ── */
.gstat{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.gstat div{background:var(--s1);border:1px solid var(--line);border-radius:11px;padding:13px}
.gstat .v6{font-family:var(--mono);font-weight:700;font-size:24px;line-height:1;letter-spacing:-.03em}
.gstat .k6{font-family:var(--mono);font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ash);margin-top:7px;line-height:1.35}
.gstat .tr6{font-family:var(--mono);font-size:9px;margin-top:6px}
.gstat .tr6.up{color:var(--jade)} .gstat .tr6.dn{color:var(--rust)}
.spark{display:flex;align-items:flex-end;gap:2px;height:22px;margin-top:9px}
.spark i{flex:1;background:var(--s4);border-radius:1px;display:block;min-width:3px}
.spark i.last{background:var(--silver)}
.gline{border:1px solid var(--line);border-radius:11px;padding:14px;margin-top:12px;
  font-size:12.5px;line-height:1.62;color:var(--steel)}
.gline b{color:var(--silver);font-weight:500}
.gleft{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line2)}
.gleft .bd4{flex:1}
.gleft .bd4 .t4{font-size:12.5px}
.gleft .bd4 .m4{font-family:var(--mono);font-size:8px;color:var(--ash);margin-top:4px;letter-spacing:.1em}
.gleft .v7{font-family:var(--mono);font-weight:700;font-size:14px}

/* ── how are we doing ── */
.hero2{background:linear-gradient(168deg,var(--s2),var(--s1) 62%);border:1px solid var(--jade-lo);
  border-radius:14px;padding:18px;margin-top:14px}
.hero2 .k7{font-family:var(--mono);font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash)}
.hero2 .v8{font-family:var(--mono);font-weight:700;font-size:46px;line-height:.9;
  letter-spacing:-.045em;color:var(--jade);margin-top:9px}
.hero2 .d8{font-family:var(--mono);font-size:10px;color:var(--jade);margin-top:9px}
.hero2 .sub8{font-size:12px;color:var(--steel);line-height:1.6;margin-top:11px}
.hero2 .sub8 b{color:var(--silver);font-weight:500}
.twoup{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.twoup div{background:var(--s1);border:1px solid var(--line);border-radius:11px;padding:14px}
.twoup .v9{font-family:var(--mono);font-weight:700;font-size:26px;line-height:1;letter-spacing:-.03em}
.twoup .k9{font-family:var(--mono);font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ash);margin-top:7px;line-height:1.35}
.twoup .t9{font-family:var(--mono);font-size:9px;margin-top:6px;color:var(--jade)}

.slipped{border:1px solid var(--tang);background:rgba(232,148,74,.13);border-radius:12px;
  padding:15px;margin-top:14px}
.slipped h4{font-family:var(--disp);font-size:19px;margin:0 0 8px;color:var(--tang);letter-spacing:-.01em}
.slipped p{margin:0;font-size:12.5px;line-height:1.6;color:var(--silver)}
.slipped .strip i.K{background:var(--tang)}
.slipped .pips2 i.fill{background:var(--tang)}

/* ── wave two readiness ── */
.gate3{border:1px solid var(--line);border-radius:13px;padding:16px;margin-top:16px}
.gate3.ready{border-color:var(--jade);background:var(--jade-dim)}
.gate3 .hd3{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.gate3 .hd3 .t7{font-family:var(--disp);font-size:20px;letter-spacing:-.012em}
.gate3.ready .hd3 .t7{color:var(--jade)}
.gate3 .hd3 .c7{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ash)}
.crit{margin-top:15px}
.crit .row3{display:flex;align-items:baseline;gap:9px;margin-bottom:6px}
.crit .row3 .lb4{flex:1;font-size:12.5px}
.crit .row3 .vl{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--steel)}
.crit .row3 .vl.hit{color:var(--jade)}
.crit .bar3{height:5px;border-radius:3px;background:var(--s3);overflow:hidden;margin-bottom:14px}
.crit .bar3 i{display:block;height:100%;background:var(--steel);transition:width .4s}
.crit .bar3 i.hit{background:var(--jade)}
.unlock{border:1px solid var(--jade);background:var(--jade-dim);border-radius:13px;
  padding:18px;margin-top:16px;text-align:center}
.unlock .big4{font-family:var(--disp);font-size:26px;color:var(--jade);letter-spacing:-.015em;line-height:1.15}
.unlock p{margin:11px 0 0;font-size:13px;line-height:1.6;color:var(--silver)}
.unlock .cnt{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--jade);margin-top:14px}
.freebadge{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--jade);border:1px solid var(--jade-lo);
  background:var(--jade-dim);border-radius:20px;padding:6px 12px;margin-bottom:16px}

.cohort{display:flex;gap:5px;margin:14px 0 0}
.cohort button{flex:1;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;
  text-transform:uppercase;padding:8px 6px;border-radius:8px;border:1px solid var(--line);color:var(--steel)}
.cohort button.on{background:var(--silver);border-color:var(--silver);color:var(--onSilver);font-weight:700}
.wavenote{font-family:var(--mono);font-size:8px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ash);margin-top:8px;text-align:center}

.setrow{display:flex;align-items:center;gap:12px;padding:13px 0}
.setrow .cp2{flex:1;font-size:12.5px}
.setrow .cp2 small{display:block;font-size:10.5px;color:var(--ash);margin-top:4px;line-height:1.5}
.seg{display:flex;gap:4px;flex:none;border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{font-family:var(--mono);font-size:8px;letter-spacing:.11em;text-transform:uppercase;
  padding:7px 11px;border-radius:6px;color:var(--ash)}
.seg button.on{background:var(--silver);color:var(--onSilver);font-weight:700}

.chk2{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;font-size:12px;font-weight:700;color:transparent;
  transition:background .15s,border-color .15s,color .15s}
.chk2.on{background:var(--jade);border-color:var(--jade);color:var(--onJade)}

/* ── decline-all durations ── */
.durs{display:flex;gap:6px;margin-top:12px}
.durs button{flex:1;font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;
  padding:10px 6px;border-radius:8px;border:1px solid var(--line);color:var(--steel)}
.durs button.on{background:var(--silver);border-color:var(--silver);color:var(--onSilver);font-weight:700}
textarea.reason{min-height:64px;margin-top:10px}

/* ── named invitation ── */
.namelink{background:var(--s1);border:1px solid var(--line);border-radius:11px;padding:14px;margin-top:12px}
.namelink .fld{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;
  padding:12px;color:var(--silver);font-family:var(--body);font-size:15px;margin-top:8px}
.namelink .fld::placeholder{color:var(--ash)}
.mismatch{border:1px solid var(--rust-lo);background:var(--rust-dim);border-radius:10px;
  padding:12px;margin-top:12px;font-size:12px;line-height:1.6;color:var(--silver)}
.mismatch b{color:var(--rust);font-weight:500}
.matched{border:1px solid var(--jade-lo);background:var(--jade-dim);border-radius:10px;
  padding:12px;margin-top:12px;font-size:12px;line-height:1.6;color:var(--silver)}
.matched b{color:var(--jade);font-weight:500}

/* ── loud clash ── */
.clashbig{border:2px solid var(--rust);background:var(--rust-dim);border-radius:12px;
  padding:14px;margin-top:12px}
.clashbig .hd4{display:flex;align-items:center;gap:9px}
.clashbig .bang{width:26px;height:26px;border-radius:50%;background:var(--rust);color:var(--onRust);
  display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:15px;flex:none;
  animation:thump 1.6s ease-in-out infinite}
@keyframes thump{50%{transform:scale(.86)}}
.clashbig .t8{flex:1;font-family:var(--disp);font-size:19px;color:var(--rust);letter-spacing:-.012em;
  line-height:1.15}
.clashbig p{margin:10px 0 0;font-size:12px;line-height:1.55;color:var(--silver)}
.duepill.clash2{border-color:var(--rust);background:var(--rust);color:var(--onRust)}
.duepill.clash2 i{background:var(--onRust)}
.nomore{font-family:var(--mono);font-size:8px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ash);border:1px dashed var(--line);border-radius:20px;padding:6px 10px;
  display:inline-flex;margin-top:11px}
/* ── richer upcoming cards ── */
.evmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* ═══════════ MODEL ═══════════
   Outcomes: K attended · F no-show · C cancel>48h · L cancel<24h · N declined · G lapse
   reliability = (Σcredit + k·m)/(n + k)   k=4, m measured. No decay in beta. All events weigh 1.
   response    = median hours from invite to answer. Lapses reported separately, never averaged in. */
const CRED={K:1,F:0,C:.80,L:.35,N:1}, K_=4, M_=.82;

const RAW=[
  ['Maya Okonkwo',   'KKNKKKNKCKKNKK',   38,  4],

  ['Suki Tanaka',    'NKNNKGKNK',       200, 52],
  ['Theo Lindqvist', 'KCLKCKKLNKCK',     12,  6],
  ['Nils Bergström', 'KFNKK',           262, 14],
  ['Ilya Voronin',   'KFLKGKFNKFKG',    322, 96],
  ['Devin Roux',     'KFKFFLKFKCFKFLKFK', 6, 40],

/* human-readable median: 4 → "4h", 40 → "2d" */
function fmtRT(h){
  if(h<1) return '<1h';
  if(h<48) return Math.round(h)+'h';
  return Math.round(h/24)+'d';
}

const P=RAW.map(([name,h,hue,rt])=>{
  const ev=[...h];
  const answered=ev.filter(c=>c!=='G');
  const num=answered.reduce((a,c)=>a+CRED[c],0);
  const yes=ev.filter(c=>'KFCL'.includes(c));
  return {
    name, hue, ev, rt, n:answered.length,
    lapses: ev.filter(c=>c==='G').length,
    ini:name.split(' ').map(w=>w[0]).join(''),
    rel:(num+K_*M_)/(answered.length+K_),
    cad:(ev.length/4).toFixed(1),
    pYes: yes.length ? (yes.filter(c=>c==='K').length + 2*.78)/(yes.length+2) : .78
  };
});
const byName=n=>P.find(p=>p.name===n);

/* A plus-one arrives with the person who vouched for them, near enough.
   P(+1 shows) ~= 0.9 x P(voucher shows). They carry no record of their own. */
function roomStats(going, p1){
  const scored=going.map(byName).filter(visPub);
  const avg = scored.length ? scored.reduce((a,p)=>a+p.rel,0)/scored.length : null;
  const nPlus = Object.values(p1||{}).reduce((a,b)=>a+b,0);
  let mu=0,va=0;
  going.forEach(n=>{ const p=byName(n).pYes; mu+=p; va+=p*(1-p);
    const k=(p1||{})[n]||0;
    for(let i=0;i<k;i++){ const q=p*.9; mu+=q; va+=q*(1-q) } });
  const sd=Math.sqrt(va);
  return { avg, scored:scored.length, total:going.length, nPlus,
           mu, lo:Math.max(0,Math.round(mu-1.15*sd)), hi:Math.round(mu+1.15*sd),
           ranked:[...going].sort((a,b)=>{
             const A=byName(a),B=byName(b);
             if(visPub(A)!==visPub(B)) return visPub(A)?-1:1;
             return visPub(A)? B.rel-A.rel : A.name.localeCompare(B.name);
           }) };
}

function projection(list){
  let mu=0,va=0;
  list.forEach(n=>{const p=byName(n).pYes; mu+=p; va+=p*(1-p)});
  const sd=Math.sqrt(va);
  return {mu, lo:Math.max(0,Math.round(mu-1.15*sd)), hi:Math.round(mu+1.15*sd)};
}

/* ═══════════ HELPERS ═══════════ */
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};
/* Standing is level plus direction. Two rules on top of that:
     · slipping is shown only to the person themselves — it's a nudge, not a mark
     · recovering is public, because the point is to lift someone on the way back up
   Nothing renders until the number itself is public. */
function standing(p, self){
  if(!p || phase<3 || !visPub(p)) return 'none';
  const cr=c=>CRED[c]!==undefined?CRED[c]:null;
  const scored=p.ev.map(cr).filter(v=>v!==null);
  const recent=scored.slice(-4), prior=scored.slice(-9,-4);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const r=avg(recent), q=avg(prior);
  const trend = (r!==null&&q!==null) ? r-q : 0;
  if(p.rel<.70) return trend>=.20 ? 'rec' : 'bad';
  if(trend<=-.20) return self ? 'dec' : 'good';   // only you see the slip
  if(p.rel>=.88) return 'good';
  return trend>=.20 ? 'rec' : 'good';
}

const av=(p,s)=>{
  const st=standing(p);
  const base = st==='none' ? `background:hsl(${p.hue} 9% ${58+(p.hue%7)*3}%);` : '';
  return `<div class="av st-${st}" style="${base}${
    s?`width:${s}px;height:${s}px;font-size:${s*.32}px`:''}">${p.ini}</div>`;
};

const STANDING_KEY=`<div class="stkey">
  <span><b style="background:rgba(92,212,155,.17);border:1.5px solid var(--jade)"></b>Good standing</span>
  <span><b style="background:rgba(99,169,242,.16);border:1.5px solid var(--sky)"></b>On the way back</span>
  <span><b style="background:rgba(240,97,79,.15);border:1.5px solid var(--rust)"></b>Bad standing</span>
</div>`;
/* In the opening weeks the network has barely any history — the demo should
   show that rather than pretending everyone arrives with a record. */
const shownEv = p => phase===1 ? p.ev.slice(0, p.hue%3) : p.ev;
const strip=(p,max=26)=>{
  const ev=shownEv(p).slice(-max);
  return ev.length
    ? `<div class="strip">${ev.map(c=>`<i class="${c}"></i>`).join('')}</div>`
    : `<div class="strip" style="opacity:.35">${'<i class="G"></i>'.repeat(6)}</div>`;
};
const LEG=`<div class="legend">
  <span><b style="background:var(--jade)"></b>Showed</span>
  <span><b style="background:var(--rust)"></b>No-show</span>
  <span><b style="background:var(--jade);opacity:.38"></b>Cancelled early</span>
  <span><b style="background:var(--steel);opacity:.55"></b>Honest no</span>
  <span><b style="border:1px dashed var(--ash)"></b>Ghosted</span></div>`;

function attendeeList(going,p1,live,dropped){
  const arr=live?arrivalsFor(live):{};
  const here=n=>arr[n]==='in';
  dropped=dropped||[];
  const rated=going.filter(n=>visPub(byName(n)))
    .sort((a,b)=>(here(b)-here(a)) || byName(b).rel-byName(a).rel);
  const fresh=going.filter(n=>!visPub(byName(n)))
    .sort((a,b)=>(here(b)-here(a)) || a.localeCompare(b));
  const row=(n,i)=>{const p=byName(n), k=(p1||{})[n]||0, rated_=visPub(p);
    return `<div class="rank" onclick="event.stopPropagation();openRecord('${n}')">
      <div class="ix">${here(n)?'':phase>=3&&rated_?i+1:'·'}</div>
      ${av(p,26)}
      <div class="nm">${p.name}</div>
      ${k?`<span class="p1">+${k}</span>`:''}
      ${here(n)?`<span class="there">There</span>`
        :`<div class="sc ${!rated_?'na':p.rel>=.88?'hi':p.rel<.70?'lo':''}">${
          phase>=3&&rated_?pct(p.rel):'—'}</div>`}</div>`};

  if(phase<3) return `<div style="margin-top:4px">${going.map((n,i)=>row(n,i)).join('')}</div>
    <div class="note">Reliability appears at week 9.${live?' Arrivals show live.':''}</div>`;

  return `
    ${rated.length?`<div class="seclab">${live?'In the room and on the way':'Going'} <span class="ct2">${rated.length}</span></div>
      ${rated.map((n,i)=>row(n,i)).join('')}`:''}
    ${fresh.length?`<div class="seclab new">New here <span class="ct2">${fresh.length}</span></div>
      <p class="newnote">Fewer than eight events. No number yet — for them or anyone else.</p>
      ${fresh.map(n=>row(n)).join('')}`:''}
    ${dropped.length?`<div class="seclab" style="color:var(--rust)">Cancelled today
        <span class="ct2">${dropped.length}</span></div>
      ${dropped.map(n=>{const p=byName(n);return `<div class="rank" style="opacity:.72">
        <div class="ix"></div>${av(p,26)}
        <div class="nm">${p.name}</div>
        <span class="gone">Cancelled</span></div>`}).join('')}
      <p class="newnote" style="margin-top:8px">Shown rather than removed. Someone pulling out on the
        day is worth knowing about, and quietly deleting them would hide it.</p>`:''}
    ${phase>=3?STANDING_KEY:''}
    ${Object.values(p1||{}).some(Boolean)?`<div class="note">Plus-ones carry no record of their own.
      They're projected off whoever's bringing them.</div>`:''}`;
}

/* compact version for the swipe card */
function miniList(going,p1,live,dropped){
  const arr=live?arrivalsFor(live):{};
  const here=n=>arr[n]==='in';

  const fresh=going.filter(n=>!visPub(byName(n)));
  const order=phase>=3?rated.concat(fresh):[...going].sort((a,b)=>here(b)-here(a));
  const show=order.slice(0,4), rest=going.length-show.length;
  const nHere=going.filter(here).length;
  return `<div class="mini2">
    ${show.map(n=>{const p=byName(n),k=(p1||{})[n]||0;return `<div class="r"
      onclick="event.stopPropagation();openRecord('${n}')">

      nHere?` · ${nHere} there`:''}${dropped.length?` · ${dropped.length} cancelled`:''}</div>`:''}
  </div>`;
}

function openRoom(id){
  const i=INV.find(x=>x.id===id);

    ${attendeeList(i.going,i.p1,null)}
    <button class="btn g sm" style="margin-top:14px" onclick="close_()">Close</button>
  </div></div>`);
  const m=document.getElementById('mount'); m.innerHTML=''; m.appendChild(s2);
}

/* Why a number is what it is. The strip is the argument; the number is a summary of it. */
function openRecord(name){
  const p=byName(name); if(!p) return;
  const ys=p.ev.filter(c=>'KFCL'.includes(c)), nos=p.ev.filter(c=>c==='N').length;
  const shows=ys.filter(c=>c==='K').length;
  const cls2 = !visPub(p)?'na':p.rel>=.88?'hi':p.rel<.70?'lo':'mid';
  const reading = !visPub(p)
    ? `Only ${p.n} answered invitations so far. Nobody sees a number until eight, including ${p.name.split(' ')[0]}.`
    : nos/p.ev.length>=.4
      ? `Turns down most of what they're invited to and shows up to nearly everything they accept.`
      : p.rel<.70
        ? `Says yes often and arrives sometimes. ${p.ev.filter(c=>c==='F'||c==='L').length} no-shows
           across ${p.ev.length} invitations. <b>The gap between the yes and the turnout is the number.</b>`
        : `Answers most things and turns up to most of what they accept.`;

  const sheet=el(`<div class="scrim" onclick="if(event.target===this)close_()"><div class="sheet">
    <div class="grab"></div>
    <div class="rec-hd">
      ${av(p,42)}
      <div class="bd3"><div class="n6">${p.name}</div>
        <div class="h6">${p.n} ANSWERED · ${p.ev.length} INVITED</div></div>
      <div class="big3 ${cls2}">${phase>=3&&visPub(p)?pct(p.rel):'—'}</div>
    </div>
    <div style="margin-top:16px">${strip(p)}</div>
    ${LEG}
    ${phase>=3&&visPub(p)?`<div class="three">
      <div><div class="v ${cls2}">${pct(p.rel)}</div><div class="k">Reliability</div></div>
      <div><div class="v">${fmtRT(p.rt)}</div><div class="k">Usual<br>reply</div></div>
      <div><div class="v">${p.cad}</div><div class="k">Per<br>quarter</div></div>
    </div>
    ${p.lapses?`<div class="note">Left ${p.lapses} invitation${p.lapses===1?'':'s'} unanswered.
      That counts against reply time, not reliability.</div>`:''}`:''}
    <div class="reads">${reading}</div>
    <button class="btn g sm" style="margin-top:14px" onclick="close_()">Close</button>
  </div></div>`);
  const m=document.getElementById('mount'); m.innerHTML=''; m.appendChild(sheet);
}

/* ═══════════ SIGNUP ═══════════ */
function disclosure(){return `<div class="disc">
  <div class="eyebrow">Before you sign up</div>
  <div class="freebadge">Free, forever, for the first 200 real ones</div>
  <h1>Parties that count.</h1>

  <div class="dblock">
    <p>Partiful is built for volume and potential. The optimization is breadth. Roster is built for
       getting closer to your favorites. The optimization is depth.</p>
  </div>

  <div class="dblock">
    <h4>How Roster works</h4>
    <p>Let's clear up the signal: you shouldn't feel bad for missing a Partiful event. You should if
       you flake for a Roster one.</p>
    <p style="margin-top:12px">Attendance is recorded two ways — a check-in at the event and the host
       confirming afterwards. From that comes a record: how reliably you turn up, how fast you
       answer, how often you're out. Full names and real socials, no pseudonyms.</p>
  </div>

  <div class="dblock key">
    <h4>The only mark against you is saying yes and flaking</h4>
    <p>Roster wants you to decline. Declines count as an honest answer, and the sooner and more

  </div>

  <div class="dblock">
    <h4>The reward</h4>
    <p>Reliable people should be celebrated. Instead of having to build that reputation up from

       that on every occasion.</p>
  </div>

  <div class="dblock">
    <h4>Social breaks and redemption</h4>
    <p>Recent behaviour counts for far more than old behaviour, and marks age out. A bad stretch

const CARD_H=488, PEEK=62;

function p1Control(o, fn, policy, full){
  if(!policy || policy==='none') return '';
  if(full) return `<span class="nomore">No more +1s</span>`;
  return `<div class="p1box ${o.mine?'on':''}">
    <div class="lb2">Bringing someone?
      <small>${o.mine?'The host will be asked':'The host approves each one'}</small></div>
    <button onclick="event.stopPropagation();${fn}${fn.endsWith(',')?'-1)':'(-1)'}">−</button>
    <div class="ct">${o.mine||0}</div>
    <button onclick="event.stopPropagation();${fn}${fn.endsWith(',')?'1)':'(1)'}">+</button>
  </div>`;
}

/* The deck is answers first, then tonight. You can't get to the party
   until you've dealt with what's owed. */
function buildDeck(){
  const owed=INV.filter(i=>!i.st && i.due && !i.lapsed)
    .map(i=>({kind:'ask', inv:i, t:i.t, who:i.host, when:`${i.day} · answer by ${i.due}`,
              where:i.where||'', going:i.going, p1:i.p1, waited:i.waited, sent:i.sent}));
  return [...owed, ...deck];
}

function vToday(){
  const cards=buildDeck();
  const lapsed=INV.filter(i=>i.lapsed);

  /* the deadline list only appears once there's nothing left to answer */
  if(!cards.length) return `
    <div class="eyebrow">Nothing left today</div>
    <h1 style="margin-bottom:14px">${deckDone.length?`You answered ${deckDone.length}.`:'All clear.'}</h1>
    ${deckDone.map(d=>`<div class="lapse">
      <div class="bd"><div class="t" style="color:var(--silver)">${d.t}</div>
        <div class="m">${d.a==='go'?'CONFIRMED':'CANCELLED · HOST NOTIFIED'}</div></div>
      <span class="pill ${d.a==='go'?'go':'no'}">${d.a==='go'?'Going':'Out'}</span></div>`).join('')}
    ${lapsedList(lapsed)}
    <button class="btn g sm" style="margin-top:16px" onclick="resetDeck();INV.forEach(i=>{if(i.due)i.st=null});render()">Reset demo</button>`;

  const n=Math.min(cards.length,3);
  const owed=cards.filter(c=>c.kind==='ask').length;

  const stack=cards.slice(0,n).map((c,d)=>{
    const y=(n-1-d)*PEEK, sc=1-d*.03, top=d===0, ask=c.kind==='ask';
    const clashing = c.clashWith && deck.concat(deckDone.filter(x=>x.a==='go'))
      .some(x=>x.t===c.clashWith);
    const red = ask || clashing;
    const full=(c.going.length + Object.values(c.p1||{}).reduce((a,b)=>a+b,0)) >= (c.cap||99);
    return `<div class="stack ${top?'':'behind'}" style="

      <div class="swipe" ${top?'id="card"':''} style="height:${CARD_H}px">
        ${top?`<div class="stamp ${red?'yes2':'go'}" id="sgo">${ask?'YES':'GOING'}</div>
               <div class="stamp ${red?'no2':'no'}" id="sno">${ask?'NO':'OUT'}</div>`:''}
        <div class="flipper" ${top?'id="flip"':''} style="height:${CARD_H}px">
          <div class="face front ${red?'ask':''}" ${top?'':'style="padding:0"'}>
            ${!top?`<div class="peek">
              <div class="pw2">${c.when}</div>
              <div class="pt">${c.t}</div>
            </div>`:`
            <div class="whenrow">
              <span class="when">${c.when}</span>
              ${ask?`<span class="duepill"><i></i>Answer due</span>`
                   :clashing?`<span class="duepill clash2"><i></i>Double booked</span>`
                   :c.live?`<span class="livepill"><i></i>Happening now</span>`:''}
            </div>
            <h3>${c.t}</h3>
            <div class="who">${c.who}${c.where?' · '+c.where:''}</div>
            ${c.details?`<div class="deets">${c.details}</div>`:''}`}
            ${top?`
              <div class="spacer"></div>
              ${miniList(c.going,c.p1,c.live?c.t:null,c.dropped)}
              ${clashing?clashLine(c):''}
              ${ask?waitedLine(c):p1Control(c,'bumpDeck',c.plus,full)}
              ${!ask&&c.live?liveBar(c):''}
              <div class="hintrow" style="margin-top:12px">
                <span style="color:var(--rust)">← ${ask?"Can't come":"Can't make it"}</span>
                <span class="flipcue">Tap</span>
                <span style="color:var(--jade)">${ask?"I'll be there":"Still going"} →</span></div>`:''}
          </div>
          ${top?`<div class="face back ${red?'ask':''}">

            <div class="scrollr">

          </div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');

  return `
  ${owed?`<div class="eyebrow" style="margin-bottom:10px">${owed} to answer first</div>`:''}
  <div class="deck" style="height:${CARD_H+(n-1)*PEEK}px;margin-top:${owed?0:4}px">${stack}</div>`;

/* Tap flips, horizontal drag answers, vertical drag scrolls the back face.
   Axis is locked on the first meaningful move so the three never fight. */
let swipeCtl=null;
function bindSwipe(){
  if(swipeCtl) swipeCtl.abort();          // drop the previous render's listeners
  const card=document.getElementById('card'); if(!card) return;
  swipeCtl=new AbortController();
  const sig={signal:swipeCtl.signal};
  const flip=document.getElementById('flip');
  const go=document.getElementById('sgo'), no=document.getElementById('sno');
  const TAP=9, THROW=95;
  let x0=0,y0=0,dx=0,dy=0,drag=false,axis=null,moved=0;

  const pt=e=>e.touches&&e.touches[0]?e.touches[0]:e;

  const down=e=>{
    const p=pt(e); x0=p.clientX; y0=p.clientY;
    dx=dy=moved=0; axis=null; drag=true;
    card.style.transition='none';
  };
  const move=e=>{
    if(!drag) return;
    const p=pt(e); dx=p.clientX-x0; dy=p.clientY-y0;
    moved=Math.max(moved,Math.hypot(dx,dy));
    if(!axis && moved>TAP) axis = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
    if(axis!=='x') return;                       // let the back face scroll
    if(e.cancelable && e.type==='touchmove') e.preventDefault();
    card.style.transform=`translateX(${dx}px) rotate(${dx*.045}deg)`;
    go.style.opacity=Math.max(0,Math.min(1,dx/THROW));
    no.style.opacity=Math.max(0,Math.min(1,-dx/THROW));
  };
  const up=()=>{
    if(!drag) return; drag=false;
    card.style.transition='transform .3s ease, opacity .3s ease';

    if(moved<=TAP){                              // a tap: flip it
      flip.classList.toggle('flip');
      card.style.transform=''; go.style.opacity=0; no.style.opacity=0;
      return;
    }
    if(axis==='x' && Math.abs(dx)>THROW){
      const dir=dx>0?1:-1, a=dx>0?'go':'no';
      card.style.transform=`translateX(${dir*540}px) rotate(${dir*22}deg)`;
      card.style.opacity='0';
      drag=false; moved=0;
      setTimeout(()=>answer(a),190);
      return;
    }
    card.style.transform=''; go.style.opacity=0; no.style.opacity=0;
  };

  card.addEventListener('pointerdown',down,sig);
  window.addEventListener('pointermove',move,sig);
  window.addEventListener('pointerup',up,sig);
  window.addEventListener('pointercancel',up,sig);
  card.addEventListener('touchstart',down,{passive:true,...sig});
  card.addEventListener('touchmove',move,{passive:false,...sig});
  card.addEventListener('touchend',up,sig);
  card.addEventListener('touchcancel',up,sig);
}

const TODAY=new Date(2026,6,31);
const MOS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const key=d=>`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
const parseKey=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b,c)};
const fmtDay=k=>{const d=parseKey(k);return `${DOW[(d.getDay()+6)%7]} ${d.getDate()} ${MOS[d.getMonth()].slice(0,3)}`};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dayDiff=(a,b)=>Math.round((parseKey(a)-parseKey(b))/864e5);
const t12=hhmm=>{const[h,m]=hhmm.split(':').map(Number);
  const ap=h<12?'AM':'PM', h12=h%12===0?12:h%12; return `${h12}:${String(m).padStart(2,'0')} ${ap}`};

function calendar(d){
  const yr=d.calYr, mo=d.calMo;
  const lead=(new Date(yr,mo,1).getDay()+6)%7, ndays=new Date(yr,mo+1,0).getDate();
  let cells='';
  for(let i=0;i<lead;i++) cells+='<span></span>';
  for(let n=1;n<=ndays;n++){
    const dd=new Date(yr,mo,n), k=key(dd), past=dd<TODAY;
    cells+=`<button class="${past?'pastd':''} ${k===d.date?'sel':''}" ${past?'disabled':''}
      onclick="pickDate('${k}')">${n}</button>`;
  }
  return `<div class="cal">
    <div class="calhead"><button onclick="calMove(-1)">‹</button>
      <div class="mo">${MOS[mo]} ${yr}</div>
      <button onclick="calMove(1)">›</button></div>
    <div class="cg">${DOW.map(x=>`<div class="h">${x[0]}</div>`).join('')}</div>
    <div class="cg">${cells}</div></div>`;
}
function calMove(n){ let m=draft.calMo+n,y=draft.calYr;
  if(m<0){m=11;y--} if(m>11){m=0;y++} draft.calMo=m; draft.calYr=y; render() }
function pickDate(k){ draft.date=k; render() }
function setPlus(p){ draft.plus=p; render() }
/* With a short fuse, a fast answer is worth more than a perfect record —
   you need to know tonight, and you can still fill the seat if they decline. */
function orderedRoster(d){
  const lead=dayDiff(d.date,key(TODAY));
  const list=[...ROSTER];
  if(lead>4) return list;
  return list.sort((a,b)=>{
    const A=byName(a), B=byName(b);
    const score=p=>{
      if(!visPub(p)) return -1;
      const speed=Math.max(0, 1 - Math.log10(1+p.rt)/2.2);   // hours -> 0..1
      return speed*0.65 + p.rel*0.35;
    };
    return score(B)-score(A);
  });
}

function toggleDraft(n){ draft.guests.has(n)?draft.guests.delete(n):draft.guests.add(n); render() }
function addRegulars(k){
  HISTORY.regulars.slice(0,k||HISTORY.regulars.length).forEach(n=>draft.guests.add(n));
  render();
}

function draftMath(d){
  const list=[...d.guests];
  const st=roomStats(list,{});
  return { ...st, list, ceiling: d.plus==='open'?list.length*2:list.length };
}

/* Recommendation has two constraints pulling opposite ways:
   leave enough runway to backfill, but give this particular list time to answer. */
function recommendDl(d){
  const list=[...d.guests];
  const lead=dayDiff(d.date,key(TODAY));
  const BACKFILL=3;                                    // days needed to fill gaps
  let p80=1;
  if(list.length){
    const rts=list.map(n=>byName(n).rt/24).sort((x,y)=>x-y);
    p80=Math.ceil(rts[Math.min(rts.length-1,Math.floor(rts.length*.8))]);
  }
  const needed=Math.max(1,p80);                        // days the list needs to reply
  const ideal=Math.min(BACKFILL, Math.max(0, lead-needed));
  const conflict = lead - needed < BACKFILL;
  return { days:ideal, needed, lead, conflict, p80,
           date:key(addDays(parseKey(d.date),-ideal)) };
}

function dlOptions(d){
  const lead=dayDiff(d.date,key(TODAY));
  const out=[];
  for(let i=0;i<=Math.min(lead,21);i++) out.push(i);
  return out;
}
