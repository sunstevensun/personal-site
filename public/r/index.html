function sendDraft(){
  const d=draft;
  if(!d.guests.size){ alert('Add at least one guest.'); return }
  const id=Math.max(...EVENTS.map(e=>e.id),1)+1;
  EVENTS.push({ id, title:d.title||'Untitled', details:d.details,
    when:`${fmtDay(d.date)} · ${t12(d.start)}`, where:d.where||'TBC',
    ends:t12(d.end), cap:d.cap, plus:d.plus,
    dl:fmtDay(key(addDays(parseKey(d.date),-d.dlDays))),
    deadlineIn:d.dlDays, sameDay:dayDiff(d.date,key(TODAY))===0,
    guests:[...d.guests], going:[], cancelled:[], unanswered:d.guests.size,
    p1:{}, door:{} });
  curEv=id; draft=null; tab='event'; render();
}

let bigOn=false;

  const w=document.getElementById('bigw'), cd=document.getElementById('bigcd'),

  if(b){ b.style.transition='none'; b.style.transform=`scaleX(${secsLeft/ROT})`;

}

function checkIn(n){ const e=ev(); e.door[n]='in'; render() }
function checkInP1(n){
  const e=ev(); e.p1in=e.p1in||{};
  const k=(e.p1||{})[n]||0;
  e.p1in[n]=Math.min(k,(e.p1in[n]||0)+1);
  if(!e.door[n]) e.door[n]='in';        // the +1 arrived, so they did
  render();
}

/* ═══════════ INVITATIONS ═══════════
   Invitations are earned, not allotted. Someone you brought who turns up through their
   first three events earns you another. Someone who doesn't, doesn't. Totals are never
   quoted — what a member sees is what they can spend right now. */

const HOLD_DAYS=14;

/* Invitations are a standing, not a balance.
   Every cycle your allowance is recomputed from your own record and the records of
   everyone you brought — ongoing, not just their first few events. Unused allowance
   does not roll over, and a link nobody claims inside HOLD_DAYS is consumed, not
   returned: someone ignoring an invitation for a fortnight is itself a signal about
   who you chose. */
const CYCLE_DAYS=30;
/* Wave one: founding hosts earn a batch every time they host. Batch size flexes
   with how the people they've already brought turned out — hosting gets you the
   chance to invite, judgment gets you more of it. */
const BASE_BATCH=2;
const HOSTED=5, BATCHES_SPENT=7;
const TIERS=[
  {min:.90, n:3, lbl:'90% and up'},
  {min:.80, n:2, lbl:'80–89%'},
  {min:.70, n:1, lbl:'70–79%'},
  {min:0,   n:0, lbl:'Below 70%'},
];
const tierFor=rel=>TIERS.find(t=>rel>=t.min).n;

/* Someone you brought counts heavily at first and stops counting once they've held
   good standing long enough — at that point they're on their own record, not yours.
   Trouble keeps counting for as long as it lasts. */
const SETTLE_DAYS=120;
function contribution(sp){
  const p=byName(sp.name);
  if(!p || !visPub(p))    return {d:0,  st:'new',     why:'no record yet'};
  if(p.rel<.70)           return {d:-1, st:'costing', why:'costing you'};
  if(p.rel<.88)           return {d:0,  st:'holding', why:'holding'};
  if(sp.days>=SETTLE_DAYS)return {d:0,  st:'settled', why:'settled · on their own record'};
  return {d:+1, st:'earning', why:'reliable'};
}

let isFounder=true;
const FOUNDING_SEED=5;              // the original thirty, first cycle only
const myRel=.92, myN=12;
let cycleDay=19;                    // 19 of 30
let usedThisCycle=1;
let SPONSORED=[
  {name:'Dot Chen',     days:48},    // reliable, still counting
  {name:'Maya Okonkwo', days:190},   // reliable, long settled
  {name:'Ilya Voronin', days:150},   // trouble keeps counting regardless of age
  {name:'Sam Ito',      days:12},    // too new to have a record
];

/* hit rate on people already brought — the thing that sizes your next batch */
function hitRate(){
  const rated=SPONSORED.filter(sp=>{const p=byName(sp.name); return p&&visPub(p)});
  if(!rated.length) return null;
  const good=rated.filter(sp=>byName(sp.name).rel>=.85).length;
  return good/rated.length;
}
function batchSize(){
  const h=hitRate();
  if(h===null) return BASE_BATCH;
  if(h>=.80) return BASE_BATCH+1;
  if(h<.50)  return Math.max(1,BASE_BATCH-1);
  return BASE_BATCH;
}

function allowance(){
  if(!isFounder && phase<4) return {base:0,inv:0,seed:0,total:0,waveOne:false};
  if(isFounder && phase<4){
    const earned = HOSTED*batchSize();
    return {waveOne:true, hosted:HOSTED, batch:batchSize(),
            seed:0, base:0, inv:0, total:Math.max(0, earned)};
  }
  const base = myN>=8 ? tierFor(myRel) : 0;
  const inv  = SPONSORED.reduce((a,sp)=>a+contribution(sp).d,0);
  return {waveOne:false, seed:0, base, inv, total:Math.max(0, base+inv)};
}
const remaining = () => Math.max(0,
  allowance().total - (allowance().waveOne ? BATCHES_SPENT : usedThisCycle) - LINKS.length);
const nextCycle = () => Math.max(0, (phase>=3&&myN>=8?tierFor(myRel):0)
  + SPONSORED.reduce((a,sp)=>a+contribution(sp).d,0));

let LINKS=[ {id:1, token:'rstr.to/k7-mq2', days:9, forName:'Marco Villa'} ];
let newName='';
let claimStep=0;

function vInvites(){
  const al=allowance(), rem=remaining();
  if(phase<4 && !isFounder) return `
    <div class="locked" style="margin-top:16px"><b>Wave one.</b> Only the founding hosts can bring
      people in right now, and they earn a batch each time they host. Invitations open to everyone
      once the network clears its three thresholds — see the Network tab.<br><br>
      The fastest way to help get there: <b>attend three events and start hosting your own.</b></div>`;

  const wo=al.waveOne;
  return `
  <div class="note" style="margin:14px 0 0">${wo
    ? `Wave one. You earn a batch every time you host — and how big the batch is depends on how the
       people you've already brought turned out.`
    : `Recomputed every ${CYCLE_DAYS} days from your record and the records of everyone you brought.
       What you don't use, you lose.`}</div>

  ${slotsView()}`;
}

function slotsView(){
  const al=allowance(), rem=remaining();
  const wo=al.waveOne;
  const used=(wo?BATCHES_SPENT:usedThisCycle)+LINKS.length;
  const nxt=wo?al.batch:nextCycle(), delta=wo?0:nxt-al.total;
  return `
  <div class="cyc">
    <div class="hd"><span class="k">${wo?'Earned so far':'This cycle'}</span>
      <span class="k">${wo?`${al.hosted} events hosted`:`${CYCLE_DAYS-cycleDay} days left`}</span></div>
    <div style="display:flex;align-items:flex-end;gap:12px">
      <div class="big2">${rem}</div>
      <div class="sub2">of ${al.total}<br>still yours</div>
    </div>
    <div class="pips">${Array.from({length:Math.max(al.total,1)},(_,i)=>
      `<i class="${i<rem?'left':'gone'}"></i>`).join('')}</div>
    <div class="nxt">
      <span class="k">${wo?'Next event you host':'Next cycle, on today\'s records'}</span>
      <span class="v ${wo?(al.batch>BASE_BATCH?'up':al.batch<BASE_BATCH?'dn':''):(delta>0?'up':delta<0?'dn':'')}">${
        wo?`+${al.batch}`:nxt}${!wo&&delta?` (${delta>0?'+':''}${delta})`:''}</span>
    </div>
  </div>
  ${wo?`<div class="note">${(()=>{const h=hitRate();
    return h===null ? `Batches are ${BASE_BATCH} for now. Once the people you've brought have records,
      the batch grows or shrinks with how they turned out.`
    : h>=.80 ? `<b>${Math.round(h*100)}% of the people you've brought are reliable</b>, so your
      batches are ${al.batch} rather than ${BASE_BATCH}. Judgment earns more than frequency does.`
    : h<.50 ? `<b>Only ${Math.round(h*100)}% of the people you've brought are reliable</b>, so your
      batches are down to ${al.batch}. Hosting more won't fix that — bringing better people will.`
    : `${Math.round(h*100)}% of the people you've brought are reliable, which holds your batch at
      ${BASE_BATCH}.`})()}</div>`
  :`<div class="note">Anything left when the cycle turns is gone.</div>`}

  ${rem?`<div class="namelink">
     <div class="note" style="margin:0">Who is this for?</div>
     <input class="fld" placeholder="Their full name" value="${newName}" oninput="newName=this.value">
     <div class="note">The link only works for this name. Whoever claims it has to enter the same
       thing — an invitation isn't transferable, and if it gets forwarded it simply won't open.</div>
     <button class="btn sm" style="margin-top:12px" onclick="mintLink()">Create the link</button>
   </div>`
   :`<div class="emptyq" style="margin-top:14px">${wo
     ? `All spent.<br>${al.batch} more the next time you host.`
     : `Nothing left this cycle.<br>${nxt?`${nxt} arrive${nxt===1?'s':''} in ${CYCLE_DAYS-cycleDay} days.`:'Your record has to recover first.'}`}</div>`}

  ${LINKS.length?`<div class="wk" style="margin-top:20px">Out, unclaimed · ${LINKS.length}</div>
    ${LINKS.map(l=>`<div class="slot">
      <div class="ic used">↗</div>
      <div class="bd"><div class="t">${l.forName||l.sentTo||'Link sent'}</div>
        <div class="m ${HOLD_DAYS-l.days<=4?'bad':'live'}">${HOLD_DAYS-l.days} DAYS TO CLAIM · THEN IT'S GONE</div></div>
      <button class="act" onclick="revokeLink(${l.id})">Revoke</button></div>`).join('')}
    <div class="linkbox">
      <code>${LINKS.slice(-1)[0].token}</code>
      <button onclick="alert('Copied. The preview shows only the Roster mark — not your name, and not that it is an invitation.')">Copy</button>
    </div>
    <div class="note"><b>Unclaimed means spent.</b> If they don't answer inside ${HOLD_DAYS} days it
      doesn't come back to you — someone ignoring an invitation for a fortnight told you something
      about how they'd treat an event. Revoking now returns it; letting it lapse doesn't.</div>`:''}

  <div class="wk" style="margin-top:22px">What sets the number</div>
  <div class="card q" style="padding:4px 13px 13px">
    ${!wo?`<div class="contrib">
      <div class="bd"><div class="t">Your own record</div>
        <div class="m">${phase>=3?pct(myRel).toUpperCase()+' RELIABILITY':'NOT VISIBLE UNTIL WEEK 9'}</div></div>

      <div class="d plus">+${al.hosted*al.batch}</div></div>`:''}
    <div class="contrib">
      <div class="bd" onclick="meTab='plusones';render()"><div class="t">People you've vouched for</div>
        <div class="m">${SPONSORED.length} · SEE YOUR +1S</div></div>
      <div class="d ${al.inv>0?'plus':al.inv<0?'minus':'zero'}">${
        al.inv>0?'+'+al.inv:al.inv<0?'−'+Math.abs(al.inv):'0'}</div>

  ${phase>=4?`<div class="wk" style="margin-top:18px">What your own record is worth</div>

function mintLink(){
  if(!remaining()) return;
  const n=(newName||'').trim();
  if(n.split(/\s+/).length<2){ alert('Both names. The person claiming has to match exactly.'); return }
  LINKS.push({id:Date.now(), days:0, forName:n,
    token:'rstr.to/'+Math.random().toString(36).slice(2,4)+'-'+Math.random().toString(36).slice(2,5)});
  newName=''; render();
}
function revokeLink(id){ LINKS=LINKS.filter(l=>l.id!==id); render() }




function vPlusOnes(){
  const active =SPONSORED.filter(sp=>contribution(sp).st!=='settled');
  const settled=SPONSORED.filter(sp=>contribution(sp).st==='settled');
  const row=sp=>{const c=contribution(sp), p=byName(sp.name);
    return `<div class="contrib" ${c.st==='settled'?'style="opacity:.6"':''}>
      ${p?av(p,30):''}
      <div class="bd" onclick="openRecord('${sp.name}')"><div class="t">${sp.name}</div>

          :'NO RECORD YET · '+sp.days+' DAYS IN'}</div></div>
      <div class="d ${c.d>0?'plus':c.d<0?'minus':'zero'}">${c.d>0?'+1':c.d<0?'−1':'0'}</div>
    </div>`};

  return `
  <div class="note" style="margin:14px 0 0">Someone you brought counts most in their first months.
    Once they've held a good record long enough they settle and stop counting — they're on their own
    record by then.</div>
  <div class="note" style="margin-top:8px">Tap a name to see what their number is made of.</div>

  ${active.length?`<div class="wk" style="margin-top:20px">Still counting · ${active.length}</div>
    <div class="card q" style="padding:4px 13px 13px">${active.map(row).join('')}</div>`:''}

  ${settled.length?`<div class="wk" style="margin-top:20px">On their own record · ${settled.length}</div>
    <div class="card q" style="padding:4px 13px 13px">${settled.map(row).join('')}</div>
    <div class="note">These no longer affect what you're granted. They held a good record long enough
      to be judged on it alone.</div>`:''}`;
}

/* ── how are we doing ── */
const NET={

  inBand:   {1:[0.41],  2:[0.48,0.52], 3:[0.58,0.63,0.68,0.72,0.76,0.79],
             4:[0.58,0.63,0.68,0.72,0.76,0.79,0.82,0.84]},
  cancels:  {1:[0.29],  2:[0.29,0.33,0.36],
             3:[0.29,0.33,0.36,0.40,0.44,0.47,0.52,0.55,0.58,0.61,0.63,0.66],
             4:[0.29,0.33,0.36,0.40,0.44,0.47,0.52,0.55,0.58,0.61,0.63,0.66,0.69,0.71]},
  leftOnTheirOwn:{1:0, 2:3, 3:14, 4:19},

  cohorts:{

};

let cohort='all';

function vGlobal(){
  const ph=phase;
  if(ph===4) return vGlobalWaves();
  const r=NET.rel[ph], b=NET.inBand[ph], c=NET.cancels[ph], g=NET.gates[ph], t=NET.target;

  if(ph===1) return `
    <div class="eyebrow">Everyone on Roster</div>

    <div class="cold" style="margin-top:16px">Week one. <b>Nobody has enough history for any of this

    ${waveGate(g,t,ph)}`;

  const bandNow=Math.round(b[b.length-1]*100), bandWas=Math.round(b[0]*100);
  const cNow=Math.round(c[c.length-1]*100), cWas=Math.round(c[0]*100);

  return `
  <div class="eyebrow">Everyone on Roster</div>
  <h1>How are we doing?</h1>

  <div class="hero2">
    <div class="k7">Our reliability</div>

    ${relUp>0?`<div class="d8">↑ ${relUp} points since records went live</div>`
      :`<div class="d8" style="color:var(--ash)">First numbers just landed</div>`}
    <div class="spark" style="height:26px;margin-top:12px">${r.map((v,i)=>
      `<i class="${i===r.length-1?'last':''}" style="height:${Math.max(8,(v-70)/20*100)}%"></i>`).join('')}</div>
    <div class="sub8"><b>When one of us answers honestly, everyone's number goes up.</b>

  <div class="twoup">
    <div><div class="v9 hi">${bandNow}%</div>
      <div class="k9">Events that hit<br>their projection</div>
      <div class="t9">${bandNow>bandWas?`↑ ${bandNow-bandWas} points`:'starting out'}</div></div>
    <div><div class="v9 hi">${cNow}%</div>
      <div class="k9">Misses that came<br>with notice</div>
      <div class="t9">${cNow>cWas?`was ${cWas}%`:'tracking'}</div></div>
  </div>

  <div class="wk" style="margin-top:22px">Cancelling instead of ghosting</div>
  <div class="card q" style="padding:14px 13px">
    <div class="spark" style="height:38px">${c.map((v,i)=>
      `<i class="${i===c.length-1?'last':''}" style="height:${v*100}%"></i>`).join('')}</div>
    <div class="note" style="margin-top:11px"><b>${cNow}% of missed events now come with notice</b>${
      cNow>cWas?`, up from ${cWas}%`:''}. This is the one that moves first and moves most — telling a
      host early costs you almost nothing and it's the thing they feel soonest.</div>
  </div>

  ${NET.leftOnTheirOwn[ph]?`<div class="wk" style="margin-top:20px">People who left</div>
  <div class="card q" style="padding:14px 13px">
    <div class="note" style="margin:0"><b>${NET.leftOnTheirOwn[ph]} people with an average

  </div>`:''}

  ${waveGate(g,t,ph)}`;
}

function vGlobalWaves(){
  const c=NET.cohorts[cohort], w1=NET.cohorts.w1, w2=NET.cohorts.w2;
  return `
  <div class="eyebrow">Everyone on Roster</div>
  <h1>How are we doing?</h1>

  <div class="cohort">
    ${[['all','Everyone'],['w1','Wave one'],['w2','Wave two']].map(([k,l])=>
      `<button class="${cohort===k?'on':''}" onclick="cohort='${k}';render()">${l}</button>`).join('')}
  </div>
  <div class="wavenote">${c.n} people</div>

  <div class="hero2" style="margin-top:12px">
    <div class="k7">${c.label}'s reliability</div>
    <div class="v8">${c.rel}%</div>
    ${cohort==='w2'?`<div class="d8" style="color:var(--tang)">${w1.rel-w2.rel} points behind wave one</div>`
      :cohort==='w1'?`<div class="d8">↑ ${w1.rel-NET.rel[3][0]} points since records went live</div>`
      :`<div class="d8">Both waves together</div>`}
    <div class="sub8">${cohort==='w2'
      ? `<b>New people start lower and climb.</b> Wave one looked like this at week five. The gap
         closing is the thing to watch.`
      : cohort==='w1'
      ? `<b>The founding group after six months.</b> This is what a settled cohort looks like.`

  <div class="twoup">

      <div class="k9">Misses that came<br>with notice</div>
      <div class="t9">${cohort==='w2'?`vs ${w1.cancels}% wave one`:'and climbing'}</div></div>
  </div>

  ${cohort==='all'?`<div class="gline" style="margin-top:12px">
    <b>Wave one sits at ${w1.rel}%, wave two at ${w2.rel}%.</b> A gap is expected — new people
    haven't had time to build a record and haven't learned yet that declining is free. Watch whether
    it closes.</div>`:''}

  ${waveGate(NET.gates[4],NET.target,4)}`;
}

/* Three gates, all of which have to hold before anyone can bring the next wave in. */
function waveGate(g,t,ph){
  const p1=Math.min(1,g.reliable/t.reliable);
  const p2=Math.min(1,g.newHosts/t.newHosts);
  const p3=g.rel===null?0:Math.min(1,g.rel/t.rel);
  const ready = p1>=1 && p2>=1 && p3>=1;

  if(ready) return `<div class="unlock">
    <div class="big4">Wave two is in progress.</div>
    <p>The network cleared its three thresholds — ${g.reliable} reliable people out of ${g.invited}
      ever invited, ${g.newHosts} guests who became hosts, and reliability holding at ${g.rel}%.</p>
    <p>Every member can now invite. What you're granted depends on your own record and on the
      records of whoever you bring.</p>
    <div class="cnt">180 joined so far</div>
  </div>`;

  return `<div class="gate3">
    <div class="hd3">
      <div class="t7">Before wave two</div>
      <div class="c7">${[p1,p2,p3].filter(x=>x>=1).length} of 3</div>
    </div>
    <div class="note" style="margin:0">Nobody can bring anyone in until the network is stable enough
      to absorb them. Three things have to hold.</div>
    <div class="crit">
      <div class="row3"><div class="lb4">Reliable members</div>
        <div class="vl ${p1>=1?'hit':''}">${g.reliable} / ${t.reliable}</div></div>
      <div class="bar3"><i class="${p1>=1?'hit':''}" style="width:${p1*100}%"></i></div>
      <div class="note" style="margin:-8px 0 12px">${g.reliable} of the ${g.invited} people on
        Roster hold a reliable record.</div>

      <div class="row3"><div class="lb4">Guests who became hosts</div>
        <div class="vl ${p2>=1?'hit':''}">${g.newHosts} / ${t.newHosts}</div></div>
      <div class="bar3"><i class="${p2>=1?'hit':''}" style="width:${p2*100}%"></i></div>

      <div class="row3"><div class="lb4">Network reliability</div>
        <div class="vl ${p3>=1?'hit':''}">${g.rel===null?'—':g.rel+'%'} / ${t.rel}%</div></div>
      <div class="bar3"><i class="${p3>=1?'hit':''}" style="width:${p3*100}%"></i></div>
      <div class="note" style="margin:-8px 0 4px">The average reliability of everyone on Roster is
        ${g.rel===null?'not measurable yet':g.rel+'%'}. Yours is ${phase>=2?pct(myRel):'not visible yet'}.</div>
    </div>
    <div class="note">Turn up to three events and you can host your own. Two events thrown is what
      counts here — once proves you tried, twice proves it stuck. This is the line that decides
      whether Roster grows or just persists.</div>
  </div>`;
}

/* ── claim page ── */
const CLAIM_FOR='Marco Villa';
let claimName='';
const nameMatch=(a,b)=>a.toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim()
                     ===b.toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();

function vClaim(){
  const typed=(claimName||'').trim();
  const ok=typed && nameMatch(typed,CLAIM_FOR);
  const wrong=typed.split(/\s+/).length>=2 && !ok;
  return `<div class="claim">
    <div class="crest">R</div>
    <div style="flex:1"></div>
    <h1>Maya Okonkwo<br>has invited you.</h1>
    <div class="fromwho" style="margin-top:22px">
      ${av(byName('Maya Okonkwo'),34)}
      <div class="bd"><div class="t">Maya Okonkwo</div>
        <div class="m">MEMBER SINCE JUNE</div></div>
    </div>
    <div class="note" style="margin-top:18px">This invitation was issued to one person by name.
      Enter yours to open it.</div>
    <input class="field" placeholder="Your full name" value="${claimName}"
      oninput="claimName=this.value" style="margin-top:10px">

    <div style="flex:1"></div>

  </div>`;
}

/* ═══════════ GATE ═══════════
   Not security — anyone can read the source. It stops the casual forward,
   which is the actual risk with a link about scoring people by name. */
const PASSPHRASE='welcome homie';
const norm=x=>(x||'').toLowerCase().replace(/[^a-z]/g,'');

/* key is derived from the phrase, so changing it invalidates every old unlock */
const GATE_KEY='rstr:'+norm(PASSPHRASE).length+':'+
  norm(PASSPHRASE).split('').reduce((a,c)=>((a*31+c.charCodeAt(0))>>>0),7).toString(36);
let unlocked=false, oriented=false, gateWrong=false;
try{ unlocked = sessionStorage.getItem(GATE_KEY)==='1' }catch(e){}

function tryGate(){
  const el2=document.getElementById('pw');
  if(norm(el2&&el2.value)===norm(PASSPHRASE)){
    unlocked=true; gateWrong=false;
    try{ sessionStorage.setItem(GATE_KEY,'1') }catch(e){}
  } else { gateWrong=true }
  render();
}

function vGate(){
  return `<div class="gate2">
    <div class="mk">Roster<span>.</span></div>
    <div class="sub3">Private demo</div>
    <input id="pw" class="${gateWrong?'wrong':''}" placeholder="passphrase"
      autocapitalize="off" autocorrect="off" spellcheck="false"
      onkeydown="if(event.key==='Enter')tryGate()">
    <button onclick="tryGate()">Enter</button>
    <div class="hint2">${gateWrong?'Not it. Try again.':'Ask whoever sent you this.'}</div>
  </div>`;
}

function vOrient(){
  return `<div class="orient">
    <div class="eyebrow">A demo, not the real thing</div>
    <h1>Have a look around.</h1>
    <div class="note" style="margin:8px 0 18px;font-size:12.5px">Nothing here saves, nothing is

    <div class="ostep"><div class="no2">1</div><div class="bd2"><b>Start as a host</b>
      <small>Top bar, tap Host. Open Supper Club and look at the projected turnout — that's the
      number the whole thing exists to produce.</small></div></div>
    <div class="ostep"><div class="no2">2</div><div class="bd2"><b>Make an event</b>
      <small>The + button. Watch the projection move as you add people.</small></div></div>
    <div class="ostep"><div class="no2">3</div><div class="bd2"><b>Run the door</b>
      <small>Settle the last party first, then Door appears. Two words, changes every few
      seconds.</small></div></div>
    <div class="ostep"><div class="no2">4</div><div class="bd2"><b>Then be a guest</b>
      <small>Tap Guest. Swipe the cards. Tap one to see who else is going.</small></div></div>

    <div class="otip"><b>The Week 1 / 5 / 9 buttons</b> move you through the rollout. In week one
      nobody sees any scores at all, including themselves. They appear in week five, and become
      visible to everyone in week nine.</div>

    <div style="flex:1;min-height:20px"></div>
    <button class="btn" onclick="oriented=true;render()">Start</button>

}

/* ═══════════ SHELL ═══════════ */
const GUEST_TABS=[['today','Today'],['fortnight','Fortnight'],['checkin','Check in'],['me','You']];
let meTab='record';
let theme='dark';
function setTheme(t){ theme=t; render() }
const HOST_TABS_ALL =[['events','Events'],['door','Door'],['confirm','Confirm']];
const hostTabs = () => gated()
  ? HOST_TABS_ALL.filter(t=>t[0]!=='door')
  : HOST_TABS_ALL.filter(t=>t[0]!=='confirm');
const CTX={today:'Thu 31 July',fortnight:'Your calendar',checkin:'At the door',me:'Your record',
  events:'Hosting',event:'Hosting',create:'New event',
  door:'Live now',confirm:'Settling',claim:'Invitation'};

function render(){
  const scr=document.getElementById('screen'), nav=document.getElementById('nav');
  const mnt=document.getElementById('mount');

  if(!unlocked){ mnt.innerHTML=vGate(); return }
  if(mnt.innerHTML.indexOf('gate2')>=0) mnt.innerHTML='';

  if(!oriented){
    scr.innerHTML=vOrient(); scr.style.padding='0'; nav.innerHTML='';
    document.getElementById('ctx').textContent='Welcome';
    document.getElementById('demo').innerHTML='';
    return;
  }
  if(!seen){
    scr.innerHTML=disclosure(); nav.innerHTML=''; scr.style.padding='0';
    document.getElementById('ctx').textContent='Signup'; demoBar(); return;
  }
  if(tab==='claim'){
    scr.innerHTML = vClaim();
    scr.style.padding='0';
    nav.innerHTML='';
    document.getElementById('ctx').textContent=CTX[tab];
    demoBar(); return;
  }
  scr.style.padding = tab==='today' ? '10px 16px calc(22px + var(--safe))' : '';
  const host = actor==='host' && isFounder;
  const tabs = host?hostTabs():GUEST_TABS;

  /* an unsettled event removes the door entirely rather than showing it locked */
  if(host && gated() && tab==='door') tab='confirm';
  if(host && !gated() && tab==='confirm' && PAST.confirmed) { /* stays reachable from Past */ }
  if(!tab || (!tabs.find(t=>t[0]===tab) && !['event','create'].includes(tab))) tab=tabs[0][0];

  const views={today:vToday,fortnight:vFortnight,checkin:vCheckin,me:vMe,
    events:vEvents,event:vEvent,create:vCreate,door:vDoor,confirm:vConfirm,
    claim:vClaim};
  scr.innerHTML=views[tab]();
  document.getElementById('ctx').textContent=CTX[tab]||'';
  const dot=document.getElementById('dot'); if(dot) dot.className = phase>=2 ? 'on' : '';
  const root=document.documentElement;
  if(root){ if(theme==='light') root.setAttribute('data-theme','light');
            else root.removeAttribute('data-theme'); }

  nav.style.gridTemplateColumns=`repeat(${tabs.length},1fr)`;
  nav.innerHTML=tabs.map(([k,l])=>{
    const locked = false;
    const on = tab===k || (k==='events'&&['event','create'].includes(tab));
    return `<button class="${on?'on':''}${locked?' lk':''}"
      onclick="${locked?'lockedTap()':`go('${k}')`}">${locked?'◦ ':''}${l}</button>`;
  }).join('');

  demoBar();
  if(tab==='today') bindSwipe();
  if(tab==='door' || (tab==='checkin' && ciState==='enter')) startCode(); else stopCode();
}
function go(t){ tab=t; render(); document.getElementById('screen').scrollTop=0 }
function lockedTap(){ tab='confirm'; render();
  alert('Settle '+PAST.title+' before opening another door. Everything else stays open.') }

function demoBar(){
  document.getElementById('demo').innerHTML=`
    <span class="lbl">As</span>
    ${isFounder?`<button class="${actor==='host'?'on':''}" onclick="setActor('host')">Host</button>
      <button class="${actor!=='host'?'on':''}" onclick="setActor('guest')">Guest</button>`
      :`<button class="on">Guest</button>`}
    <button class="${isFounder?'on':''}" onclick="setFounder(!isFounder)">${
      isFounder?'Founder':'Newer'}</button>
    <span class="lbl" style="margin-left:6px">Wk</span>
    ${[[1,'1'],[2,'5'],[3,'9'],[4,'12']].map(([p,l])=>
      `<button class="${phase===p?'on':''}" onclick="setPhase(${p})">${l}</button>`).join('')}`;
}

const ROT=6;
let secsLeft=ROT, tickTimer=null;
function startCode(){
  if(codeTimer) return;
  secsLeft=ROT;
  const bar=()=>document.getElementById('tickbar');
  const run=()=>{ const b=bar(); if(!b) return;
    b.style.transition='none'; b.style.transform='scaleX(1)';
    requestAnimationFrame(()=>{b.style.transition=`transform ${ROT}s linear`;b.style.transform='scaleX(0)'}) };
  const paint=()=>{ const c=document.getElementById('cdown');
    if(c) c.textContent=`Words change in ${secsLeft} second${secsLeft===1?'':'s'}`;
    if(bigOn){ const bc=document.getElementById('bigcd');
      if(bc) bc.textContent=`Words change in ${secsLeft} second${secsLeft===1?'':'s'}` } };
  run(); paint();

  tickTimer=setInterval(()=>{
    if(!document.getElementById('cdown') && !bigOn){ stopCode(); return }
    secsLeft--; if(secsLeft<0) secsLeft=ROT;
    paint();
  },1000);

  codeTimer=setInterval(()=>{ codeIdx++; secsLeft=ROT;
    const t=document.getElementById('codetext');
    if(t) t.textContent=code();
    run(); paint(); paintBig();
  },ROT*1000);
}
function stopCode(){
  if(codeTimer){clearInterval(codeTimer);codeTimer=null}
  if(tickTimer){clearInterval(tickTimer);tickTimer=null}
}

render();

</script>
